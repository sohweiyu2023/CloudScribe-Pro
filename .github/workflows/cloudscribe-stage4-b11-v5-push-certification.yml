name: CloudScribe Stage 4 Batch 11 v5 push certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudscribe-stage4-b11-v5-push-certification.yml'

permissions:
  contents: read
  issues: write

jobs:
  certify:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      TESTED_HEAD: 801952c69b17ab38d7bacb527f9de1401076bc2a
      BASE_HEAD: d59bad2039af0a650ae521a81a238ce39ecb8de7
      EXPECTED_TEST_TOTAL: '262'
      RESULT_ISSUE: '23'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: 801952c69b17ab38d7bacb527f9de1401076bc2a
          path: source
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: 'source/**/packages.lock.json'

      - name: Create evidence directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'stage4-b11-v5-evidence'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'stage4-b11-v5-diagnostics'
          $package = Join-Path $env:RUNNER_TEMP 'stage4-b11-v5-package'
          New-Item -ItemType Directory -Force $evidence,$diagnostics,$package | Out-Null
          "CLOUDSCRIBE_EVIDENCE_DIR=$evidence" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CLOUDSCRIBE_DIAGNOSTIC_DIR=$diagnostics" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CLOUDSCRIBE_PACKAGE_DIR=$package" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bind exact frozen candidate and repair scope
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:TESTED_HEAD) { throw "Unexpected frozen candidate head: $head" }
          git merge-base --is-ancestor $env:BASE_HEAD $head
          if ($LASTEXITCODE -ne 0) { throw 'Frozen candidate is not descended from Batch 11 base.' }
          if ((dotnet --version).Trim() -ne '10.0.400') { throw 'Wrong .NET SDK.' }
          $actual = @(git diff --name-only $env:BASE_HEAD $env:TESTED_HEAD -- | Where-Object { $_ -and $_.Trim() } | Sort-Object -Unique)
          $expected = @(
            'SHA256SUMS.txt',
            'src/CloudScribe.App/CloudScribe.App.csproj',
            'src/CloudScribe.Domain/Pricing/PricingPlanDefinition.cs',
            'tests/CloudScribe.Architecture.Tests/RepositoryVersionContractTests.cs',
            'tests/CloudScribe.Domain.Tests/PricingPlanDefinitionTests.cs')
          if ($actual.Count -ne $expected.Count) { throw "Unexpected frozen repair file count: $($actual.Count)" }
          foreach ($path in $expected) { if ($actual -notcontains $path) { throw "Missing intended frozen repair file: $path" } }
          foreach ($path in $actual) { if ($expected -notcontains $path) { throw "Unexpected frozen repair file: $path" } }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Frozen checkout is not initially clean.' }

      - name: Locked restore
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }

      - name: Portable governance and deterministic regressions
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $commands = @(
            'python tools/update_sha256_manifest.py --check',
            'python tools/verify_repository.py',
            'python tools/verify_project_dependencies.py',
            'python tools/verify_stage1_source.py',
            'python tools/verify_stage2_source.py',
            'python tools/verify_stage3_source.py',
            'python tools/verify_stage4_source.py',
            'python -B tools/run_verifier_self_tests.py',
            'python -B tools/run_python_regression_shards.py --all')
          foreach ($command in $commands) {
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) { throw "Gate failed: $command" }
          }

      - name: Pre-native formatting baseline
        id: pre_format
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic *>&1 | Tee-Object -FilePath (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'pre-native-format.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Pre-native formatting baseline failed.' }

      - name: Strict Release build and analyzers
        id: release_build
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Release build/analyzer gate failed.' }

      - name: Native Windows compiled-test and visual admission
        id: native
        shell: pwsh
        working-directory: source
        env:
          CLOUDSCRIBE_STAGE2_EVIDENCE_DIR: ${{ runner.temp }}\stage4-b11-v5-evidence
          CLOUDSCRIBE_EXPECTED_DOTNET_TEST_TOTAL: '262'
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/verify-stage2.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows regression certification failed.' }

      - name: Exact compiled-test count
        id: compiled_count
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $trx = @(Get-ChildItem $env:CLOUDSCRIBE_EVIDENCE_DIR -Filter '*.trx' -File -Recurse)
          if ($trx.Count -lt 4) { throw "Expected at least four TRX files, found $($trx.Count)" }
          $total = 0; $passed = 0; $failed = 0; $skipped = 0
          foreach ($file in $trx) {
            [xml]$xml = Get-Content $file.FullName -Raw
            $c = $xml.TestRun.ResultSummary.Counters
            $total += [int]$c.total
            $passed += [int]$c.passed
            $failed += [int]$c.failed
            $skipped += [int]$c.notExecuted
          }
          "total=$total passed=$passed failed=$failed skipped=$skipped expected=$env:EXPECTED_TEST_TOTAL" | Set-Content (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'compiled-test-count.txt') -Encoding utf8
          if ($total -ne [int]$env:EXPECTED_TEST_TOTAL -or $passed -ne $total -or $failed -ne 0 -or $skipped -ne 0) { throw 'Compiled-test count gate failed.' }
          "CLOUDSCRIBE_COMPILED_TEST_TOTAL=$total" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Post-native source and manifest verification
        id: post_source
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/verify_stage4_source.py *>&1 | Tee-Object -FilePath (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-stage4-source.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Post-native Stage 4 source verifier failed.' }
          python tools/update_sha256_manifest.py --check *>&1 | Tee-Object -FilePath (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-manifest.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Post-native source manifest check failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Post-native git diff check failed.' }

      - name: Validate post-native worktree
        id: post_native_clean
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @((git diff --name-only), (git diff --cached --name-only)) | Where-Object { $_ -and $_.Trim() }
          $untracked = @(git ls-files --others --exclude-standard | Where-Object { $_ -and $_.Trim() })
          $tracked | Set-Content (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-native-tracked.txt') -Encoding utf8
          $untracked | Set-Content (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-native-untracked.txt') -Encoding utf8
          if ($tracked.Count -ne 0) { $tracked | Write-Host; throw 'Native verification changed tracked files.' }
          $unexpected = @($untracked | Where-Object { $_ -notmatch '^(src|tests)/[^/]+/(bin|obj)/' })
          if ($unexpected.Count -ne 0) { $unexpected | Write-Host; throw 'Native verification left unexpected untracked files.' }
          foreach ($project in @(Get-ChildItem src,tests -Filter '*.csproj' -File -Recurse)) {
            foreach ($leaf in @('bin','obj')) {
              $target = Join-Path $project.Directory.FullName $leaf
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
            }
          }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Worktree not clean after validated native cleanup.' }

      - name: Rehydrate locked restore for post-native format
        id: post_restore
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Post-native locked restore failed.' }

      - name: Post-native formatting stability
        id: post_format
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic *>&1 | Tee-Object -FilePath (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-native-format.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Post-native formatting stability failed.' }

      - name: Validate post-format state and remove only generated intermediates
        id: post_format_clean
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @((git diff --name-only), (git diff --cached --name-only)) | Where-Object { $_ -and $_.Trim() }
          $untracked = @(git ls-files --others --exclude-standard | Where-Object { $_ -and $_.Trim() })
          $tracked | Set-Content (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-format-tracked.txt') -Encoding utf8
          $untracked | Set-Content (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-format-untracked.txt') -Encoding utf8
          if ($tracked.Count -ne 0) { $tracked | Write-Host; throw 'Post-format gate changed tracked files.' }
          $unexpected = @($untracked | Where-Object { $_ -notmatch '^(src|tests)/[^/]+/(bin|obj)/' })
          if ($unexpected.Count -ne 0) { $unexpected | Write-Host; throw 'Post-format gate left unexpected untracked files.' }
          foreach ($project in @(Get-ChildItem src,tests -Filter '*.csproj' -File -Recurse)) {
            foreach ($leaf in @('bin','obj')) {
              $target = Join-Path $project.Directory.FullName $leaf
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
            }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Post-format git diff check failed.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Worktree not clean after post-format normalization.' }
          if ((git rev-parse HEAD).Trim() -ne $env:TESTED_HEAD) { throw 'HEAD moved during certification.' }

      - name: Special-character launcher regression
        id: launcher
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/test-build-launcher-special-paths.ps1 -SourceRoot (Get-Location).Path -ScratchRoot (Join-Path $env:RUNNER_TEMP 'Stage4 Batch11 V5 Frozen (7) & ! literal')
          if ($LASTEXITCODE -ne 0) { throw 'Special-character launcher regression failed.' }

      - name: Final source stability after launcher regression
        id: final_stability
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @((git diff --name-only), (git diff --cached --name-only)) | Where-Object { $_ -and $_.Trim() }
          $untracked = @(git ls-files --others --exclude-standard | Where-Object { $_ -and $_.Trim() })
          $tracked | Set-Content (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-launcher-tracked.txt') -Encoding utf8
          $untracked | Set-Content (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'post-launcher-untracked.txt') -Encoding utf8
          if ($tracked.Count -ne 0) { $tracked | Write-Host; throw 'Launcher regression changed tracked files.' }
          $unexpected = @($untracked | Where-Object { $_ -notmatch '^(src|tests)/[^/]+/(bin|obj)/' })
          if ($unexpected.Count -ne 0) { $unexpected | Write-Host; throw 'Launcher regression left unexpected untracked files.' }
          foreach ($project in @(Get-ChildItem src,tests -Filter '*.csproj' -File -Recurse)) {
            foreach ($leaf in @('bin','obj')) {
              $target = Join-Path $project.Directory.FullName $leaf
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
            }
          }
          python tools/verify_stage4_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Final Stage 4 source verifier failed.' }
          python tools/update_sha256_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Final source manifest check failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Final git diff check failed.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Final worktree is not clean.' }

      - name: Deterministic source archive
        id: archive
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/create_source_archive.py --output-directory $env:CLOUDSCRIBE_PACKAGE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic source archive failed.' }
          $zip = Get-ChildItem $env:CLOUDSCRIBE_PACKAGE_DIR -Filter '*.zip' -File | Select-Object -First 1
          if ($null -eq $zip) { throw 'Source archive ZIP missing.' }
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "CLOUDSCRIBE_SOURCE_ARCHIVE=$($zip.Name)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CLOUDSCRIBE_SOURCE_ARCHIVE_SHA256=$zipHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "archive=$($zip.Name)`nsha256=$zipHash" | Set-Content (Join-Path $env:CLOUDSCRIBE_DIAGNOSTIC_DIR 'source-archive.txt') -Encoding utf8

      - name: Final exact no-mutation guard and certification summary
        id: final_guard
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:TESTED_HEAD) { throw 'HEAD moved during certification.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Final git diff check failed.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Final exact no-mutation guard failed.' }
          $summary = [ordered]@{
            stage = 4
            batch = 11
            run_id = '${{ github.run_id }}'
            tested_head = $env:TESTED_HEAD
            dotnet_sdk = (dotnet --version).Trim()
            compiled_tests = [int]$env:CLOUDSCRIBE_COMPILED_TEST_TOTAL
            failed = 0
            skipped = 0
            source_archive = $env:CLOUDSCRIBE_SOURCE_ARCHIVE
            source_archive_sha256 = $env:CLOUDSCRIBE_SOURCE_ARCHIVE_SHA256
            stage4_promoted = $false
            stage5_started = $false
          }
          $summary | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:CLOUDSCRIBE_PACKAGE_DIR 'STAGE4-BATCH11-V5-PUSH-CERTIFICATION.json') -Encoding utf8

      - name: Upload certification evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-batch11-v5-push-certification
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/stage4-b11-v5-evidence/**
            ${{ runner.temp }}/stage4-b11-v5-diagnostics/**
            ${{ runner.temp }}/stage4-b11-v5-package/**

      - name: Report result to evidence issue
        if: always()
        uses: actions/github-script@v8
        env:
          SOURCE_ARCHIVE_SHA256: ${{ env.CLOUDSCRIBE_SOURCE_ARCHIVE_SHA256 }}
        with:
          script: |
            const body = [
              `STATUS: ${context.job}`,
              `Run: ${context.runId}`,
              `Tested head: 801952c69b17ab38d7bacb527f9de1401076bc2a`,
              `Pre-format: ${{ steps.pre_format.outcome }}`,
              `Release build: ${{ steps.release_build.outcome }}`,
              `Native Windows: ${{ steps.native.outcome }}`,
              `Compiled count: ${{ steps.compiled_count.outcome }}`,
              `Post-native source: ${{ steps.post_source.outcome }}`,
              `Post-native clean: ${{ steps.post_native_clean.outcome }}`,
              `Post-native restore: ${{ steps.post_restore.outcome }}`,
              `Post-format: ${{ steps.post_format.outcome }}`,
              `Post-format clean: ${{ steps.post_format_clean.outcome }}`,
              `Launcher: ${{ steps.launcher.outcome }}`,
              `Final stability: ${{ steps.final_stability.outcome }}`,
              `Archive: ${{ steps.archive.outcome }}`,
              `Final guard: ${{ steps.final_guard.outcome }}`,
              `Source archive SHA256: ${process.env.SOURCE_ARCHIVE_SHA256 || ''}`,
              `Artifact ID: ${{ steps.upload.outputs.artifact-id }}`,
              `Job status: ${{ job.status }}`
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 23, body });
