name: CloudScribe Stage 5 Locked Restore Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cloudscribe-stage5-lock-sync
  cancel-in-progress: false

jobs:
  refresh-stage5-test-lock:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage5-fast-track
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
      - name: Deterministically refresh lock after project-reference change
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetLock = 'tests/CloudScribe.Application.Tests/packages.lock.json'

          dotnet restore tests/CloudScribe.Application.Tests/CloudScribe.Application.Tests.csproj --force-evaluate --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Stage5 lock refresh restore failed.' }

          # Force-evaluate traverses project references and may rewrite otherwise-valid
          # dependency lock files. Preserve those frozen locks, then prove that the
          # refreshed target lock makes the entire solution pass locked restore.
          $otherLocks = @(git ls-files '*/packages.lock.json' | Where-Object { $_ -ne $targetLock })
          foreach ($lock in $otherLocks) {
            git checkout -- $lock
            if ($LASTEXITCODE -ne 0) { throw "Could not restore frozen dependency lock: $lock" }
          }

          Get-ChildItem -Path . -Directory -Recurse -Filter obj -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction Stop

          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Refreshed Stage5 lock does not satisfy full-solution locked restore.' }

          Get-ChildItem -Path . -Directory -Recurse -Filter obj -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction Stop

          $changed = @(git status --porcelain=v1 --untracked-files=all)
          if ($changed.Count -eq 0) { exit 0 }
          $allowed = ' M tests/CloudScribe.Application.Tests/packages.lock.json'
          if ($changed.Count -ne 1 -or $changed[0] -ne $allowed) {
            Write-Host 'Unexpected lock refresh mutations:'
            $changed | ForEach-Object { Write-Host $_ }
            throw 'Stage5 lock refresh changed files outside the exact packages.lock.json.'
          }

          git diff --exit-code -- . ':!tests/CloudScribe.Application.Tests/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'Non-target source changed during Stage5 lock refresh.' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/CloudScribe.Application.Tests/packages.lock.json
          git commit -m 'chore(stage5): refresh locked restore after infrastructure test reference'
          if ($LASTEXITCODE -ne 0) { throw 'Stage5 lock refresh commit failed.' }
          git push origin HEAD:refs/heads/agent/stage5-fast-track
          if ($LASTEXITCODE -ne 0) { throw 'Stage5 lock refresh push failed.' }
