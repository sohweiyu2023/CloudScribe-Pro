name: CloudScribe 0.3.48 Late Gate Diagnostic

on:
  push:
    branches:
      - cloudscribe-0.3.48-late-gate-diagnostic
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-late-gates:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Reconstruct exact candidate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadRoot = '.cloudscribe-ci/payload'
          $partNames = @(
            '000.bin','001.bin','002.bin','003.bin','004.bin','005.bin','006.bin',
            '007a.bin','007b.bin','008.bin','009.bin','010a.bin','010b.bin','011a.bin','011b.bin'
          )
          $archive = Join-Path $env:RUNNER_TEMP 'CloudScribe-0.3.48-native-ci-min.tar.xz'
          $stream = [IO.File]::Open($archive,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try {
            foreach ($name in $partNames) {
              $path = Join-Path $payloadRoot $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing source carrier part: $name" }
              $bytes = [IO.File]::ReadAllBytes($path)
              $stream.Write($bytes,0,$bytes.Length)
            }
          } finally { $stream.Dispose() }
          $info = Get-Item $archive
          if ($info.Length -ne 95596) { throw "Source carrier length mismatch: $($info.Length)" }
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '1649cdfaa71f10ce4803fd468285295bf597cb805bf594dd542c386fa04fcd3b') { throw "Source carrier SHA-256 mismatch: $sha" }
          $root = Join-Path $env:RUNNER_TEMP 'cloudscribe-0.3.48-src'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          & tar.exe -xJf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed: $LASTEXITCODE" }
          "CS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified source carrier: $sha ($($info.Length) bytes)"

      - name: Overlay exact candidate hotfix pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hotfixRoot = '.cloudscribe-ci/hotfix'
          $names = @(
            '000.bin','001.bin',
            '002s_00.bin','002s_01.bin','002s_02.bin','002s_03.bin','002s_04.bin','002s_05.bin','002s_06.bin'
          )
          $archive = Join-Path $env:RUNNER_TEMP 'candidate-hotfixes.tar.xz'
          $stream = [IO.File]::Open($archive,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try {
            foreach ($name in $names) {
              $path = Join-Path $hotfixRoot $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing hotfix part: $name" }
              $bytes = [IO.File]::ReadAllBytes($path)
              $stream.Write($bytes,0,$bytes.Length)
            }
          } finally { $stream.Dispose() }
          $info = Get-Item $archive
          if ($info.Length -ne 11364) { throw "Hotfix carrier length mismatch: $($info.Length)" }
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '7d64e649b9f3f2d8480d3f093da8eebc3caf01a89e92e4a4b006891c4e43e6aa') { throw "Hotfix carrier SHA-256 mismatch: $sha" }
          & tar.exe -xJf $archive -C $env:CS_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Hotfix extraction failed: $LASTEXITCODE" }
          Write-Host "Verified candidate hotfix carrier: $sha ($($info.Length) bytes)"

      - name: Restore and build release app
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:CS_ROOT
          dotnet restore src/CloudScribe.App/CloudScribe.App.csproj --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw "App restore failed: $LASTEXITCODE" }
          dotnet build src/CloudScribe.App/CloudScribe.App.csproj -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "App build failed: $LASTEXITCODE" }

      - name: Diagnose native smoke gate
        shell: pwsh
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'late-gate-status'
          New-Item -ItemType Directory -Path $status -Force | Out-Null
          Set-Location -LiteralPath $env:CS_ROOT
          $log = Join-Path $status 'smoke.log'
          & pwsh -NoProfile -File scripts/smoke-stage1-windows.ps1 *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          "SMOKE_EXIT=$code" | Set-Content -LiteralPath (Join-Path $status 'smoke-status.txt') -Encoding utf8
          if ($code -ne 0) { throw "Native smoke failed: $code" }

      - name: Diagnose visual capture gate
        if: success()
        shell: pwsh
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'late-gate-status'
          $screens = Join-Path $env:RUNNER_TEMP 'late-gate-screenshots'
          Set-Location -LiteralPath $env:CS_ROOT
          $log = Join-Path $status 'visual.log'
          & pwsh -NoProfile -File scripts/capture-stage2-windows.ps1 $screens *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          "VISUAL_EXIT=$code" | Set-Content -LiteralPath (Join-Path $status 'visual-status.txt') -Encoding utf8
          if ($code -ne 0) { throw "Visual capture failed: $code" }

      - name: Upload late gate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudscribe-0.3.48-late-gate-diagnostic
          path: |
            ${{ runner.temp }}/late-gate-status
            ${{ runner.temp }}/late-gate-screenshots
          if-no-files-found: warn
          retention-days: 7
