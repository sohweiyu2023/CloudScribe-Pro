name: CloudScribe 0.3.48 Material Gate Diagnostic

on:
  push:
    branches:
      - cloudscribe-0.3.48-late-gate-diagnostic

permissions:
  contents: read

jobs:
  material-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Reconstruct exact repaired source state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.UTF8Encoding]::new($false)
          function Expand-Carrier([string]$Folder,[string[]]$Names,[string]$Archive,[string]$ExpectedSha,[string]$Root) {
            $stream=[IO.File]::Open($Archive,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try { foreach($name in $Names){$bytes=[IO.File]::ReadAllBytes((Join-Path $Folder $name));$stream.Write($bytes,0,$bytes.Length)} } finally {$stream.Dispose()}
            $sha=(Get-FileHash $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -ne $ExpectedSha){throw "Carrier hash mismatch for ${Folder}: $sha"}
            & tar.exe -xJf $Archive -C $Root
            if($LASTEXITCODE -ne 0){throw "Carrier extraction failed for $Folder"}
          }
          $root=Join-Path $env:RUNNER_TEMP 'cloudscribe-material-src'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Carrier '.cloudscribe-ci/payload' @('000.bin','001.bin','002.bin','003.bin','004.bin','005.bin','006.bin','007a.bin','007b.bin','008.bin','009.bin','010a.bin','010b.bin','011a.bin','011b.bin') (Join-Path $env:RUNNER_TEMP 'base.tar.xz') '1649cdfaa71f10ce4803fd468285295bf597cb805bf594dd542c386fa04fcd3b' $root
          Expand-Carrier '.cloudscribe-ci/fixtures' @('000.bin','001.bin','002.bin') (Join-Path $env:RUNNER_TEMP 'fixtures.tar.xz') 'a866788937570bd4be228c76035b170aec47d929712e96d7a08b9152239a6d11' $root
          Expand-Carrier '.cloudscribe-ci/hotfix' @('000.bin','001.bin','002s_00.bin','002s_01.bin','002s_02.bin','002s_03.bin','002s_04.bin','002s_05.bin','002s_06.bin') (Join-Path $env:RUNNER_TEMP 'hotfix.tar.xz') '7d64e649b9f3f2d8480d3f093da8eebc3caf01a89e92e4a4b006891c4e43e6aa' $root

          $wrapperPath=Join-Path $root 'scripts/invoke-nuget-audit-scan.ps1'
          $text=[IO.File]::ReadAllText($wrapperPath).Replace("`r`n","`n").Replace("`r","`n")
          $anchor='}'+"`n"+'$projectPath = $projectItem.FullName'
          $replacement='}'+"`n"+'if ($null -eq $cursor) {'+"`n"+'    throw "Audit target must resolve beneath the CloudScribe repository: $Project"'+"`n"+'}'+"`n"+'$projectPath = $projectItem.FullName'
          if($text.Contains($anchor)){[IO.File]::WriteAllText($wrapperPath,$text.Replace($anchor,$replacement),$utf8)}

          $architecturePath=Join-Path $root 'tests/CloudScribe.Architecture.Tests/AdaptiveShellTests.cs'
          $text=[IO.File]::ReadAllText($architecturePath).Replace("`r`n","`n").Replace("`r","`n")
          $old='        Assert.Contains("$projectItem.Directory", windowsAudit, StringComparison.Ordinal);'+"`n"+'        Assert.Contains("projectItem.Attributes", windowsAudit, StringComparison.Ordinal);'
          $new='        Assert.Contains("$cursor = $projectItem.Directory", windowsAudit, StringComparison.Ordinal);'+"`n"+'        Assert.DoesNotContain("$cursor = $projectItem\n", windowsAudit, StringComparison.Ordinal);'
          if($text.Contains($old)){[IO.File]::WriteAllText($architecturePath,$text.Replace($old,$new),$utf8)}

          $smokePath=Join-Path $root 'scripts/smoke-stage1-windows.ps1'
          [IO.File]::WriteAllText($smokePath,[IO.File]::ReadAllText('.cloudscribe-ci/final-overlay/smoke-stage1-windows.ps1').Replace("`r`n","`n").Replace("`r","`n"),$utf8)
          "CS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize fully repaired source with certified wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $wrapper=Join-Path $env:RUNNER_TEMP 'working-wrapper.ps1'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/sohweiyu2023/CloudScribe-Pro/9e0a363f1f38a0655723b797ff70034d926a372a/.cloudscribe-ci/invoke-cloudscribe-048-certification.ps1' -OutFile $wrapper
          & pwsh -NoProfile -File $wrapper -SourceRoot $env:CS_ROOT
          if($LASTEXITCODE -ne 0){throw "Certified wrapper failed: $LASTEXITCODE"}

      - name: Run material gate and print compact failure diagnosis
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $evidence=Join-Path $env:RUNNER_TEMP 'material-evidence'
          $log=Join-Path $env:RUNNER_TEMP 'material-gate.log'
          $env:CLOUDSCRIBE_STAGE2_EVIDENCE_DIR=$evidence
          & pwsh -NoProfile -File (Join-Path $env:CS_ROOT 'scripts/verify-stage2.ps1') *> $log
          $code=$LASTEXITCODE
          if($code -ne 0){
            Write-Host '=== MATERIAL FAILURE TAIL ==='
            Get-Content -LiteralPath $log -Tail 160
            Write-Host '=== MATERIAL FAILURE TOKENS ==='
            Select-String -LiteralPath $log -Pattern 'FAIL:|FAILED|Exception|Traceback|PREP |STEP |exit code|Process completed' | Select-Object -Last 80 | ForEach-Object { $_.Line }
            throw "Material gate failed: $code"
          }
          Write-Host 'MATERIAL_GATE_DIAGNOSTIC_PASS'

      - name: Upload compact material diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudscribe-0.3.48-material-gate-diagnostic
          path: |
            ${{ runner.temp }}/material-gate.log
            ${{ runner.temp }}/material-evidence
          if-no-files-found: warn
          retention-days: 7
