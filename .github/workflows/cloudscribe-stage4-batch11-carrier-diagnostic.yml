name: CloudScribe Stage 4 batch 11 carrier diagnostic

on:
  workflow_dispatch:
  push:
    branches: [cloudscribe-stage4-batch11-dev]
    paths: [.github/workflows/cloudscribe-stage4-batch11-carrier-diagnostic.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch11-dev
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Inspect Batch 11 binary and Base64 carriers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gzip = '.cloudscribe-ci/stage4-batch11/batch11.patch.gz'
          $b64 = '.cloudscribe-ci/stage4-batch11/batch11.patch.gz.b64'
          $patch = Join-Path $env:RUNNER_TEMP 'batch11-diagnostic.patch'
          $expectedPatch = '1ab81a857507ab7404f5952e0fd7832321aef735e10b79101a21f990a2f0d28c'
          if (-not (Test-Path $gzip -PathType Leaf)) { throw 'Binary gzip carrier missing.' }
          $gzipSha = (Get-FileHash $gzip -Algorithm SHA256).Hash.ToLowerInvariant()
          $gzipSize = (Get-Item $gzip).Length
          Write-Host "BATCH11_DIAGNOSTIC_GZIP_SHA256=$gzipSha"
          Write-Host "BATCH11_DIAGNOSTIC_GZIP_SIZE=$gzipSize"
          $env:BATCH11_GZIP = (Resolve-Path $gzip).Path
          $env:BATCH11_PATCH = $patch
          python -c "import gzip,os,pathlib; pathlib.Path(os.environ['BATCH11_PATCH']).write_bytes(gzip.decompress(pathlib.Path(os.environ['BATCH11_GZIP']).read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'Binary gzip does not decompress.' }
          $patchSha = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          $patchSize = (Get-Item $patch).Length
          Write-Host "BATCH11_DIAGNOSTIC_PATCH_SHA256=$patchSha"
          Write-Host "BATCH11_DIAGNOSTIC_PATCH_SIZE=$patchSize"
          if (Test-Path $b64 -PathType Leaf) {
            $env:BATCH11_B64 = (Resolve-Path $b64).Path
            python -c "import base64,os,pathlib; s=pathlib.Path(os.environ['BATCH11_B64']).read_text(encoding='ascii'); print('BATCH11_DIAGNOSTIC_B64_LENGTH='+str(len(s))); print('BATCH11_DIAGNOSTIC_B64_MOD4='+str(len(s)%4));"
          }
          if ($patchSha -ne $expectedPatch) { throw "Decoded patch SHA mismatch: $patchSha" }
          Write-Host 'BATCH11_DIAGNOSTIC_PATCH_IDENTITY=PASS'
