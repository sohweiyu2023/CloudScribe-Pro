name: CloudScribe Hybrid Carrier Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/cloudscribe-full-carrier-diagnostic.yml'
      - '.cloudscribe-ci/payload/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Test current split carrier followed by legacy continuation parts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='.cloudscribe-ci/payload'
          $names=@('000.bin','001.bin','002.bin','003.bin','004.bin','005.bin','006.bin','007a.bin','007b.bin','008.bin','009.bin','010a.bin','010b.bin','011a.bin','011b.bin')
          $names += (12..25 | ForEach-Object { '{0:D3}.bin' -f $_ })
          $hybrid=Join-Path $env:RUNNER_TEMP 'hybrid.tar.xz'
          $s=[IO.File]::Open($hybrid,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try { foreach($n in $names){ $b=[IO.File]::ReadAllBytes((Join-Path $root $n)); $s.Write($b,0,$b.Length) } } finally { $s.Dispose() }
          $info=Get-Item $hybrid; $sha=(Get-FileHash $hybrid -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "HYBRID bytes=$($info.Length) sha256=$sha parts=$($names.Count)"
          $extract=Join-Path $env:RUNNER_TEMP 'hybrid-extract'; New-Item -ItemType Directory -Path $extract -Force|Out-Null
          & tar.exe -xJf $hybrid -C $extract
          $tarExit=$LASTEXITCODE
          Write-Host "TAR_EXIT=$tarExit"
          $files=@(Get-ChildItem -LiteralPath $extract -Recurse -File -Force -ErrorAction SilentlyContinue)
          Write-Host "EXTRACTED_FILES=$($files.Count)"
          foreach($wanted in @('tools/verify_dotnet_sdk_version.py','tools/run_python_regression_shards.py','tools/verify_project_dependencies.py','tools/verify_repository.py','tools/verify_stage1_source.py','tools/verify_stage2_evidence_inventory.py','tools/verify_stage2_source.py','tools/create_source_archive.py','tools/verify_source_release.py','tests/test_verification_tools.py')) {
            $p=Join-Path $extract $wanted
            Write-Host "WANTED exists=$(Test-Path -LiteralPath $p -PathType Leaf) path=$wanted"
          }
          if(Test-Path -LiteralPath (Join-Path $extract 'tools')){
            Write-Host '=== TOOLS ==='; Get-ChildItem -LiteralPath (Join-Path $extract 'tools') -File | Sort-Object Name | ForEach-Object { Write-Host $_.Name }
          }
          if(Test-Path -LiteralPath (Join-Path $extract 'tests')){
            Write-Host '=== PY TESTS ==='; Get-ChildItem -LiteralPath (Join-Path $extract 'tests') -Recurse -File -Filter '*.py' | Sort-Object FullName | ForEach-Object { Write-Host $_.FullName.Substring($extract.Length+1) }
          }
          if($tarExit -ne 0){ Write-Host 'HYBRID_NOT_VALID_ARCHIVE' } else { Write-Host 'HYBRID_VALID_ARCHIVE' }
