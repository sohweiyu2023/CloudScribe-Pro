name: CloudScribe Material Script Contract Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/cloudscribe-full-carrier-diagnostic.yml'
      - '.cloudscribe-ci/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Inspect exact verify-stage2 test/evidence expectations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'src'; New-Item -ItemType Directory -Path $root -Force|Out-Null
          function ExpandCarrier($folder,$names,$archive,$sha){
            $s=[IO.File]::Open($archive,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try{foreach($n in $names){$b=[IO.File]::ReadAllBytes((Join-Path $folder $n));$s.Write($b,0,$b.Length)}}finally{$s.Dispose()}
            $a=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant();if($a-ne$sha){throw "hash mismatch $a"};tar.exe -xJf $archive -C $root;if($LASTEXITCODE-ne0){throw 'extract failed'}
          }
          ExpandCarrier '.cloudscribe-ci/payload' @('000.bin','001.bin','002.bin','003.bin','004.bin','005.bin','006.bin','007a.bin','007b.bin','008.bin','009.bin','010a.bin','010b.bin','011a.bin','011b.bin') (Join-Path $env:RUNNER_TEMP 'base.tar.xz') '1649cdfaa71f10ce4803fd468285295bf597cb805bf594dd542c386fa04fcd3b'
          ExpandCarrier '.cloudscribe-ci/fixtures' @('000.bin','001.bin','002.bin') (Join-Path $env:RUNNER_TEMP 'fixtures.tar.xz') 'a866788937570bd4be228c76035b170aec47d929712e96d7a08b9152239a6d11'
          ExpandCarrier '.cloudscribe-ci/hotfix' @('000.bin','001.bin','002s_00.bin','002s_01.bin','002s_02.bin','002s_03.bin','002s_04.bin','002s_05.bin','002s_06.bin') (Join-Path $env:RUNNER_TEMP 'hotfix.tar.xz') '7d64e649b9f3f2d8480d3f093da8eebc3caf01a89e92e4a4b006891c4e43e6aa'
          $p=Join-Path $root 'scripts/verify-stage2.ps1'; $lines=Get-Content -LiteralPath $p
          Write-Host '=== TEST/EVIDENCE EXPECTATION LINES ==='
          for($i=1;$i-le$lines.Count;$i++){
            if($lines[$i-1] -match '146|147|149|15|17|18|100|test|trx|scan|screenshot|ledger|expected|inventory|total|failed|skipped'){'{0,4}: {1}' -f $i,$lines[$i-1]}
          }
          Write-Host 'MATERIAL_SCRIPT_CONTRACT_DIAGNOSTIC_COMPLETE'
