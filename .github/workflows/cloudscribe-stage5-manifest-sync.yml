name: CloudScribe Stage 5 Manifest Sync

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage5-fast-track
    paths:
      - '.github/triggers/stage5-manifest-sync.txt'

permissions:
  contents: write

concurrency:
  group: cloudscribe-stage5-manifest-sync
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  sync:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact Stage 5 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate and verify deterministic source manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current).Trim() -ne 'agent/stage5-fast-track') { throw 'Unexpected branch.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Checkout is not clean before manifest sync.' }
          python -B tools/update_sha256_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed.' }
          python -B tools/update_sha256_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated manifest failed its own check.' }
          $changed = @(git status --porcelain=v1 --untracked-files=all)
          $unexpected = @($changed | Where-Object { $_ -notmatch '^ M SHA256SUMS\.txt$' })
          if ($unexpected.Count -ne 0) {
            $unexpected | ForEach-Object { Write-Host $_ }
            throw 'Manifest sync changed files other than SHA256SUMS.txt.'
          }
          if ($changed.Count -eq 0) {
            Write-Host 'Manifest already current; no commit needed.'
            exit 0
          }

      - name: Commit exact refreshed manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (@(git status --porcelain=v1 --untracked-files=all).Count -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- SHA256SUMS.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'chore(stage5): refresh source SHA-256 manifest'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest commit failed.' }
          git push origin HEAD:agent/stage5-fast-track
          if ($LASTEXITCODE -ne 0) { throw 'Manifest push failed.' }
