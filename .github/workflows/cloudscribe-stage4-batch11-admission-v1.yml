name: CloudScribe Stage 4 foundation batch 11 admission v4 via registered trigger
# registered-trigger bridge with single-path rematerialization repair

on:
  workflow_dispatch:
  push:
    branches: [cloudscribe-stage4-batch11-dev]
    paths: [.github/workflows/cloudscribe-stage4-batch11-admission-v1.yml]

concurrency:
  group: cloudscribe-stage4-batch11-v4-registered-trigger
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  admit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch11-v2-dev
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: source/**/packages.lock.json
      - name: Run exact Batch 11 v4 admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = 'carrier/.cloudscribe-ci/stage4-batch11-v2/admit_batch11_v3.ps1'
          $expectedRunnerBlob = '715236f144490081d27d01c1a36504fca4e4993e'
          if (-not (Test-Path $runner -PathType Leaf)) { throw 'Batch 11 v3 admission runner is missing.' }
          $actualRunnerBlob = (git -C carrier hash-object .cloudscribe-ci/stage4-batch11-v2/admit_batch11_v3.ps1).Trim()
          if ($actualRunnerBlob -ne $expectedRunnerBlob) { throw "Batch 11 v3 admission runner blob mismatch: $actualRunnerBlob" }

          $text = [IO.File]::ReadAllText($runner)
          $old = '$env:CLOUDSCRIBE_STAGED_PATHS = ($paths | ConvertTo-Json -Compress)'
          $new = '$env:CLOUDSCRIBE_STAGED_PATHS = (ConvertTo-Json -InputObject ([object[]]$paths) -Compress)'
          $first = $text.IndexOf($old, [StringComparison]::Ordinal)
          if ($first -lt 0) { throw 'Expected Batch 11 single-path serialization line is missing.' }
          if ($text.IndexOf($old, $first + $old.Length, [StringComparison]::Ordinal) -ge 0) { throw 'Expected exactly one Batch 11 serialization repair site.' }
          $patched = $text.Replace($old, $new)
          $patchedRunner = Join-Path $env:RUNNER_TEMP 'admit_batch11_v4.ps1'
          [IO.File]::WriteAllText($patchedRunner, $patched, [Text.UTF8Encoding]::new($false))
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH11_V4_RUNNER_SHA256=$((Get-FileHash $patchedRunner -Algorithm SHA256).Hash.ToLowerInvariant())"
          & $patchedRunner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Batch 11 v4 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch11-admission-v4
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage4-batch11-v3-tests/**
            ${{ runner.temp }}/stage4-batch11-v3-package/**
            ${{ runner.temp }}/stage4-batch11-v3-evidence/**
