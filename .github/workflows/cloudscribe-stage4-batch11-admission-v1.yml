name: CloudScribe Stage 4 foundation batch 11 admission v1
# binary-gzip carrier repair v3: bypass text Base64 transport; preserve exact gzip + patch SHA gates

on:
  workflow_dispatch:
  push:
    branches: [cloudscribe-stage4-batch11-dev]
    paths: [.github/workflows/cloudscribe-stage4-batch11-admission-v1.yml]

concurrency:
  group: cloudscribe-stage4-batch11-admission-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  admit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch11-dev
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: source/**/packages.lock.json
      - name: Run exact Batch 11 admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseHead = 'e21f1a055e22f99bd6a3d88d6e2802b6d0b6d4da'
          $targetBranch = 'cloudscribe-0.5.0-stage4'
          $carrierBranch = 'cloudscribe-stage4-batch11-dev'
          $patchGzipSha = '405b0e3a83322999cc45ce85e5e12099ce3e357b2e5c8bc32ad832f33cfa7c00'
          $patchSha = '1ab81a857507ab7404f5952e0fd7832321aef735e10b79101a21f990a2f0d28c'
          $expectedChanged = 10
          $expectedVerifier = 81
          $expectedRegressions = 153
          $expectedDotnetTests = 260
          $testRoot = Join-Path $env:RUNNER_TEMP 'stage4-batch11-v1-tests'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'stage4-batch11-v1-package'
          $patchPath = Join-Path $env:RUNNER_TEMP 'batch11.patch'
          $status = 'failure'
          $exitCode = 1

          function Need([bool]$ok, [string]$message) {
            if (-not $ok) { throw $message }
          }

          function Write-Locator([string]$value) {
            $locator = Join-Path $env:GITHUB_WORKSPACE 'carrier/.cloudscribe-ci/stage4-batch11/admission-v1-status.txt'
            [IO.Directory]::CreateDirectory((Split-Path $locator -Parent)) | Out-Null
            $body = "RUN_ID=$env:GITHUB_RUN_ID`nRUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT`nSTATUS=$value`nSOURCE_BASE=$baseHead`nPATCH_GZIP_SHA256=$patchGzipSha`nPATCH_SHA256=$patchSha`nEXPECTED_CHANGED_FILES=$expectedChanged`nEXPECTED_VERIFIER_TESTS=$expectedVerifier`nEXPECTED_DOTNET_TESTS=$expectedDotnetTests`n"
            [IO.File]::WriteAllText($locator, $body, [Text.UTF8Encoding]::new($false))
            git -C carrier config user.name cloudscribe-ci
            git -C carrier config user.email actions@github.com
            git -C carrier add .cloudscribe-ci/stage4-batch11/admission-v1-status.txt
            git -C carrier commit -m "ci: record Batch 11 v1 $value run $env:GITHUB_RUN_ID"
            if ($LASTEXITCODE -eq 0) {
              git -C carrier push origin "HEAD:refs/heads/$carrierBranch"
              Need ($LASTEXITCODE -eq 0) 'Unable to publish Batch 11 admission locator.'
            }
          }

          try {
            Write-Locator 'in_progress'
            Set-Location source
            Need ((git rev-parse HEAD).Trim() -eq $baseHead) 'Stage 4 target moved before Batch 11 admission.'
            Need ((dotnet --version).Trim() -eq '10.0.400') 'Wrong .NET SDK; expected exact 10.0.400.'

            $gzipPath = Join-Path $env:GITHUB_WORKSPACE 'carrier/.cloudscribe-ci/stage4-batch11/batch11.patch.gz'
            Need (Test-Path $gzipPath -PathType Leaf) 'Batch 11 binary gzip patch payload is missing.'
            Need ((Get-FileHash $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant() -eq $patchGzipSha) 'Batch 11 binary gzip payload SHA-256 mismatch.'
            $env:BATCH11_GZIP = $gzipPath
            $env:BATCH11_PATCH = $patchPath
            python -c "import gzip,os,pathlib; pathlib.Path(os.environ['BATCH11_PATCH']).write_bytes(gzip.decompress(pathlib.Path(os.environ['BATCH11_GZIP']).read_bytes()))"
            Need ($LASTEXITCODE -eq 0) 'Unable to decompress Batch 11 patch.'
            Need ((Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant() -eq $patchSha) 'Batch 11 patch SHA-256 mismatch.'
            Remove-Item Env:BATCH11_GZIP, Env:BATCH11_PATCH -ErrorAction SilentlyContinue

            git apply --index --check $patchPath
            Need ($LASTEXITCODE -eq 0) 'Batch 11 patch does not apply exactly to admitted Batch 10.'
            git apply --index $patchPath
            Need ($LASTEXITCODE -eq 0) 'Batch 11 patch application failed.'

            $staged = @(git diff --cached --name-only | Where-Object { $_ -and $_.Trim() } | Sort-Object -Unique)
            Need ($staged.Count -eq $expectedChanged) "Expected $expectedChanged staged paths; found $($staged.Count): $($staged -join ', ')"
            Need (@($staged | Where-Object { $_ -match 'packages\.lock\.json$' -or $_ -match '(^|/)(bin|obj|TestResults|__pycache__)(/|$)' }).Count -eq 0) 'Batch 11 contains forbidden generated or lockfile changes.'
            git diff --cached --check
            Need ($LASTEXITCODE -eq 0) 'Batch 11 staged whitespace check failed.'

            foreach ($command in @(
              'python tools/update_sha256_manifest.py --check',
              'python tools/verify_repository.py',
              'python tools/verify_project_dependencies.py',
              'python tools/verify_stage1_source.py',
              'python tools/verify_stage2_source.py',
              'python tools/verify_stage3_source.py',
              'python tools/verify_stage4_source.py')) {
              Invoke-Expression $command
              if ($LASTEXITCODE -ne 0) { throw "Gate failed: $command" }
            }

            $verifier = @(& python -B tools/run_verifier_self_tests.py 2>&1)
            $verifierCode = $LASTEXITCODE
            $verifier | ForEach-Object { Write-Host $_ }
            Need ($verifierCode -eq 0) 'Verifier self-tests failed.'
            Need (($verifier -join "`n") -match "PASS: $expectedVerifier/$expectedVerifier isolated auxiliary Python verifier self-tests") 'Exact 81/81 verifier self-test count missing.'

            $regressions = @(& python -B tools/run_python_regression_shards.py --all 2>&1)
            $regressionCode = $LASTEXITCODE
            $regressions | ForEach-Object { Write-Host $_ }
            Need ($regressionCode -eq 0) 'Deterministic regression suite failed.'
            Need (($regressions -join "`n") -match "$expectedRegressions/$expectedRegressions") 'Exact 153/153 regression count missing.'

            dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
            Need ($LASTEXITCODE -eq 0) 'Locked restore failed.'
            dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity minimal
            Need ($LASTEXITCODE -eq 0) 'Format gate failed.'
            dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
            Need ($LASTEXITCODE -eq 0) 'Release compiler/analyzer gate failed.'

            New-Item -ItemType Directory -Force $testRoot | Out-Null
            $projects = @(
              'tests/CloudScribe.Domain.Tests/CloudScribe.Domain.Tests.csproj',
              'tests/CloudScribe.Application.Tests/CloudScribe.Application.Tests.csproj',
              'tests/CloudScribe.Infrastructure.Tests/CloudScribe.Infrastructure.Tests.csproj',
              'tests/CloudScribe.Architecture.Tests/CloudScribe.Architecture.Tests.csproj')
            for ($i = 0; $i -lt $projects.Count; $i++) {
              $dir = Join-Path $testRoot $i
              New-Item -ItemType Directory -Force $dir | Out-Null
              dotnet test $projects[$i] -c Release --no-build --no-restore -m:1 -nodeReuse:false -p:UseSharedCompilation=false --results-directory $dir --logger 'trx;LogFileName=batch11.trx'
              Need ($LASTEXITCODE -eq 0) "Tests failed: $($projects[$i])"
            }
            $trx = @(Get-ChildItem $testRoot -Filter '*.trx' -File -Recurse)
            Need ($trx.Count -eq 4) "Expected 4 TRX files; found $($trx.Count)."
            $total=0; $passed=0; $failed=0; $skipped=0
            foreach ($file in $trx) {
              [xml]$xml = Get-Content $file.FullName -Raw
              $counters = $xml.TestRun.ResultSummary.Counters
              $total += [int]$counters.total
              $passed += [int]$counters.passed
              $failed += [int]$counters.failed
              $skipped += [int]$counters.notExecuted
            }
            Write-Host "CLOUDSCRIBE_STAGE4_BATCH11_DOTNET_TESTS total=$total passed=$passed failed=$failed skipped=$skipped"
            Need ($total -eq $expectedDotnetTests -and $passed -eq $expectedDotnetTests -and $failed -eq 0 -and $skipped -eq 0) 'Exact 260 compiled-test gate failed.'

            python tools/update_sha256_manifest.py --check
            Need ($LASTEXITCODE -eq 0) 'Manifest drifted after tests.'
            python tools/verify_stage4_source.py
            Need ($LASTEXITCODE -eq 0) 'Stage 4 verifier failed after tests.'
            git diff --cached --check
            Need ($LASTEXITCODE -eq 0) 'Staged source drifted after tests.'
            dotnet build-server shutdown | Out-Null
            git clean -fdx
            Need ($LASTEXITCODE -eq 0) 'Generated-state cleanup failed.'
            python tools/update_sha256_manifest.py --check
            Need ($LASTEXITCODE -eq 0) 'Tracked source changed during cleanup.'
            $stagedAfter = @(git diff --cached --name-only | Where-Object { $_ -and $_.Trim() })
            Need ($stagedAfter.Count -eq $expectedChanged) "Expected $expectedChanged staged paths after tests; found $($stagedAfter.Count)."

            $remote = (git ls-remote --heads origin "refs/heads/$targetBranch" | Select-Object -First 1)
            $remoteHead = ($remote -split '\s+')[0].Trim()
            Need ($remoteHead -eq $baseHead) "Stage 4 target moved before Batch 11 publication: $remoteHead"
            git config user.name cloudscribe-ci
            git config user.email actions@github.com
            git commit -m 'feat: add Stage 4 pricing plan contracts batch 11'
            Need ($LASTEXITCODE -eq 0) 'Batch 11 commit failed.'
            $testedHead = (git rev-parse HEAD).Trim()
            git push origin "${testedHead}:refs/heads/$targetBranch"
            Need ($LASTEXITCODE -eq 0) 'Unable to publish exact tested Batch 11 source.'
            Write-Host "CLOUDSCRIBE_STAGE4_BATCH11_TESTED_HEAD=$testedHead"

            New-Item -ItemType Directory -Force $packageRoot | Out-Null
            python tools/create_source_archive.py --output-directory $packageRoot
            Need ($LASTEXITCODE -eq 0) 'Deterministic Batch 11 source archive creation failed.'

            $status = 'success'
            $exitCode = 0
          }
          catch {
            Write-Host "BATCH11_V1_FAILURE: $($_.Exception.Message)" -ForegroundColor Red
            $status = 'failure'
            $exitCode = 1
          }
          finally {
            try {
              Set-Location $env:GITHUB_WORKSPACE
              git -C carrier pull --ff-only origin $carrierBranch | Out-Null
              Write-Locator $status
            }
            catch {
              Write-Host "BATCH11_V1_LOCATOR_FAILURE: $($_.Exception.Message)" -ForegroundColor Red
              $exitCode = 1
            }
          }
          exit $exitCode
      - name: Upload Batch 11 v1 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch11-admission-v1
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage4-batch11-v1-tests/**
            ${{ runner.temp }}/stage4-batch11-v1-package/**
            ${{ runner.temp }}/batch11.patch
