name: CloudScribe Stage 4 foundation batch 10 admission v1

on:
  workflow_dispatch:
  push:
    branches: [cloudscribe-stage4-batch10-dev]
    paths: [.github/workflows/cloudscribe-stage4-batch10-admission-v1.yml]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip
  BASE_HEAD: 88c58ed876de71518c4d6c538cdbc0697f4606fb
  TARGET_BRANCH: cloudscribe-0.5.0-stage4
  TRANSFORM_SHA256: 9602221ce009fbb588612395ca8a4fdd154779fac951b762f87bd03a4c152e60
  LOCAL_AUDITED_PATCH_SHA256: dbbd6f17aa2aa35818cdf147490d7f3abe9f89e7e376db9d2be2f46cd1b45066
  CANDIDATE_FINGERPRINT_SHA256: 2648c5f64e2104cd2137398ca50dbeeb12342d8203dd9c95e13828311438ea0d
  EXPECTED_CHANGED_FILES: '15'
  EXPECTED_VERIFIER_TESTS: '80'
  EXPECTED_REGRESSIONS: '153'
  EXPECTED_DOTNET_TESTS: '257'

jobs:
  admit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch10-dev
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: source/**/packages.lock.json

      - name: Publish admission start locator
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='carrier/.cloudscribe-ci/stage4-batch10/admission-status.txt'
          [IO.Directory]::CreateDirectory((Split-Path $path -Parent)) | Out-Null
          [IO.File]::WriteAllText($path,"RUN_ID=$env:GITHUB_RUN_ID`nRUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT`nSTATUS=in_progress`nSOURCE_BASE=$env:BASE_HEAD`nTRANSFORM_SHA256=$env:TRANSFORM_SHA256`nLOCAL_AUDITED_PATCH_SHA256=$env:LOCAL_AUDITED_PATCH_SHA256`nCANDIDATE_FINGERPRINT_SHA256=$env:CANDIDATE_FINGERPRINT_SHA256`n",[Text.UTF8Encoding]::new($false))
          git -C carrier config user.name cloudscribe-ci
          git -C carrier config user.email actions@github.com
          git -C carrier add .cloudscribe-ci/stage4-batch10/admission-status.txt
          git -C carrier commit -m "ci: record Batch 10 admission start run $env:GITHUB_RUN_ID"
          if($LASTEXITCODE -ne 0){throw 'Unable to commit Batch 10 start locator.'}
          git -C carrier push origin HEAD:cloudscribe-stage4-batch10-dev
          if($LASTEXITCODE -ne 0){throw 'Unable to publish Batch 10 start locator.'}

      - name: Reconstruct exact Batch 10 candidate
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Need([bool]$ok,[string]$message){if(-not $ok){throw $message}}
          Need ((git rev-parse HEAD).Trim() -eq $env:BASE_HEAD) 'Stage 4 target moved before Batch 10 admission.'
          Need ((dotnet --version).Trim() -eq '10.0.400') 'Wrong .NET SDK.'
          $root=Join-Path $env:GITHUB_WORKSPACE 'carrier/.cloudscribe-ci/stage4-batch10'
          $script=Join-Path $env:RUNNER_TEMP 'apply_batch10.py'
          $parts=1..4 | ForEach-Object { Join-Path $root ('apply_batch10-{0:d2}.part' -f $_) }
          foreach($part in $parts){Need (Test-Path $part) "Missing Batch 10 transform part: $part"}
          $joined=($parts | ForEach-Object {[IO.File]::ReadAllText($_)}) -join ''
          [IO.File]::WriteAllText($script,$joined,[Text.UTF8Encoding]::new($false))
          Need ((Get-FileHash $script -Algorithm SHA256).Hash.ToLowerInvariant() -eq $env:TRANSFORM_SHA256) 'Batch 10 transform SHA mismatch.'
          python $script
          Need ($LASTEXITCODE -eq 0) 'Batch 10 deterministic transform failed.'
          python tools/update_sha256_manifest.py --check
          Need ($LASTEXITCODE -eq 0) 'Batch 10 manifest mismatch after transform.'
          $changed=@((git diff --name-only --)+(git ls-files --others --exclude-standard)|Where-Object{$_ -and $_.Trim()}|Sort-Object -Unique)
          Need ($changed.Count -eq [int]$env:EXPECTED_CHANGED_FILES) "Expected 15 changed paths; found $($changed.Count): $($changed -join ', ')"
          Need (@($changed|Where-Object{$_ -match 'packages\.lock\.json$' -or $_ -match '(^|/)(bin|obj|TestResults|__pycache__)(/|$)'}).Count -eq 0) 'Batch 10 contains forbidden generated or dependency-lock changes.'
          git add -A
          git diff --cached --check
          Need ($LASTEXITCODE -eq 0) 'Batch 10 staged whitespace check failed.'
          $fingerprintLines=@()
          foreach($relative in ($changed|Sort-Object)){
            $hash=(Get-FileHash $relative -Algorithm SHA256).Hash.ToLowerInvariant()
            $fingerprintLines += "$hash  $relative"
          }
          $fingerprintText=($fingerprintLines -join "`n")+"`n"
          $fingerprintBytes=[Text.UTF8Encoding]::new($false).GetBytes($fingerprintText)
          $fingerprint=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($fingerprintBytes)).ToLowerInvariant()
          Need ($fingerprint -eq $env:CANDIDATE_FINGERPRINT_SHA256) "Batch 10 candidate fingerprint mismatch: $fingerprint"
          $patch=Join-Path $env:RUNNER_TEMP 'batch10-candidate.patch'
          $patchText=(git diff --cached --binary --full-index) -join "`n"
          [IO.File]::WriteAllText($patch,$patchText+"`n",[Text.UTF8Encoding]::new($false))
          Need ($LASTEXITCODE -eq 0) 'Unable to capture Batch 10 candidate patch.'
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH10_RECONSTRUCTED files=$($changed.Count) fingerprint=$fingerprint local_audited_patch=$env:LOCAL_AUDITED_PATCH_SHA256"

      - name: Portable governance and mutation gates
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$command){Invoke-Expression $command;if($LASTEXITCODE -ne 0){throw "Gate failed: $command"}}
          Run 'python tools/update_sha256_manifest.py --check'
          Run 'python tools/verify_repository.py'
          Run 'python tools/verify_project_dependencies.py'
          Run 'python tools/verify_stage1_source.py'
          Run 'python tools/verify_stage2_source.py'
          Run 'python tools/verify_stage3_source.py'
          Run 'python tools/verify_stage4_source.py'
          $verifier=@(& python -B tools/run_verifier_self_tests.py 2>&1);$code=$LASTEXITCODE;$verifier|ForEach-Object{Write-Host $_};if($code -ne 0){throw 'Verifier self-tests failed.'}
          if(($verifier -join "`n") -notmatch "PASS: $env:EXPECTED_VERIFIER_TESTS/$env:EXPECTED_VERIFIER_TESTS isolated auxiliary Python verifier self-tests"){throw 'Exact verifier self-test count missing.'}
          $reg=@(& python -B tools/run_python_regression_shards.py --all 2>&1);$code=$LASTEXITCODE;$reg|ForEach-Object{Write-Host $_};if($code -ne 0){throw 'Deterministic regression suite failed.'}
          if(($reg -join "`n") -notmatch "$env:EXPECTED_REGRESSIONS/$env:EXPECTED_REGRESSIONS"){throw 'Exact deterministic regression count missing.'}

      - name: Locked restore and format
        working-directory: source
        shell: pwsh
        run: |
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if($LASTEXITCODE -ne 0){throw 'Locked restore failed.'}
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity minimal
          if($LASTEXITCODE -ne 0){throw 'Format gate failed.'}

      - name: Release compile and analyzers
        working-directory: source
        shell: pwsh
        run: |
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if($LASTEXITCODE -ne 0){throw 'Release compiler/analyzer gate failed.'}

      - name: Exact 257 compiled tests
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Need([bool]$ok,[string]$message){if(-not $ok){throw $message}}
          $root=Join-Path $env:RUNNER_TEMP 'stage4-batch10-v1-tests';New-Item -ItemType Directory -Force $root|Out-Null
          $projects=@('tests/CloudScribe.Domain.Tests/CloudScribe.Domain.Tests.csproj','tests/CloudScribe.Application.Tests/CloudScribe.Application.Tests.csproj','tests/CloudScribe.Infrastructure.Tests/CloudScribe.Infrastructure.Tests.csproj','tests/CloudScribe.Architecture.Tests/CloudScribe.Architecture.Tests.csproj')
          for($i=0;$i -lt $projects.Count;$i++){$dir=Join-Path $root $i;New-Item -ItemType Directory -Force $dir|Out-Null;dotnet test $projects[$i] -c Release --no-build --no-restore -m:1 -nodeReuse:false -p:UseSharedCompilation=false --results-directory $dir --logger 'trx;LogFileName=batch10-v1.trx';if($LASTEXITCODE -ne 0){throw "Tests failed: $($projects[$i])"}}
          $trx=@(Get-ChildItem $root -Filter '*.trx' -File -Recurse);Need ($trx.Count -eq 4) "Expected 4 TRX files; found $($trx.Count)."
          $total=0;$passed=0;$failed=0;$skipped=0
          foreach($f in $trx){[xml]$x=Get-Content $f.FullName -Raw;$c=$x.TestRun.ResultSummary.Counters;$total+=[int]$c.total;$passed+=[int]$c.passed;$failed+=[int]$c.failed;$skipped+=[int]$c.notExecuted}
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH10_DOTNET_TESTS total=$total passed=$passed failed=$failed skipped=$skipped"
          Need ($total -eq [int]$env:EXPECTED_DOTNET_TESTS -and $passed -eq [int]$env:EXPECTED_DOTNET_TESTS -and $failed -eq 0 -and $skipped -eq 0) 'Exact compiled-test gate failed.'

      - name: Post-test stability and publish exact tested Batch 10
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Need([bool]$ok,[string]$message){if(-not $ok){throw $message}}
          python tools/update_sha256_manifest.py --check;Need ($LASTEXITCODE -eq 0) 'Manifest drifted.'
          python tools/verify_stage4_source.py;Need ($LASTEXITCODE -eq 0) 'Stage 4 verifier failed after tests.'
          git diff --cached --check;Need ($LASTEXITCODE -eq 0) 'Staged source drifted.'
          dotnet build-server shutdown|Out-Null
          git clean -fdx;Need ($LASTEXITCODE -eq 0) 'Generated-state cleanup failed.'
          python tools/update_sha256_manifest.py --check;Need ($LASTEXITCODE -eq 0) 'Tracked source changed during cleanup.'
          $staged=@(git diff --cached --name-only|Where-Object{$_ -and $_.Trim()});Need ($staged.Count -eq [int]$env:EXPECTED_CHANGED_FILES) "Expected 15 staged paths; found $($staged.Count)."
          $remote=(git ls-remote --heads origin "refs/heads/$env:TARGET_BRANCH"|Select-Object -First 1);$remoteHead=($remote -split '\s+')[0].Trim();Need ($remoteHead -eq $env:BASE_HEAD) "Stage 4 target moved: $remoteHead"
          git config user.name cloudscribe-ci;git config user.email actions@github.com
          git commit -m 'feat: complete Stage 4 provider-neutral reference contracts batch 10';Need ($LASTEXITCODE -eq 0) 'Batch 10 commit failed.'
          $tested=(git rev-parse HEAD).Trim();git push origin "${tested}:refs/heads/$env:TARGET_BRANCH";Need ($LASTEXITCODE -eq 0) 'Unable to publish exact tested Batch 10.'
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH10_TESTED_HEAD=$tested"

      - name: Deterministic admitted source archive
        working-directory: source
        shell: pwsh
        run: |
          $package=Join-Path $env:RUNNER_TEMP 'stage4-batch10-v1-package';New-Item -ItemType Directory -Force $package|Out-Null
          python tools/create_source_archive.py --output-directory $package
          if($LASTEXITCODE -ne 0){throw 'Source archive creation failed.'}

      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch10-admission-v1
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage4-batch10-v1-tests/**
            ${{ runner.temp }}/stage4-batch10-v1-package/**
            ${{ runner.temp }}/batch10-candidate.patch

      - name: Publish final admission locator
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $status='${{ job.status }}'
          git -C carrier pull --ff-only origin cloudscribe-stage4-batch10-dev
          if($LASTEXITCODE -ne 0){throw 'Unable to refresh Batch 10 carrier for final locator.'}
          $path='carrier/.cloudscribe-ci/stage4-batch10/admission-status.txt'
          [IO.File]::WriteAllText($path,"RUN_ID=$env:GITHUB_RUN_ID`nRUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT`nSTATUS=$status`nSOURCE_BASE=$env:BASE_HEAD`nTRANSFORM_SHA256=$env:TRANSFORM_SHA256`nLOCAL_AUDITED_PATCH_SHA256=$env:LOCAL_AUDITED_PATCH_SHA256`nCANDIDATE_FINGERPRINT_SHA256=$env:CANDIDATE_FINGERPRINT_SHA256`n",[Text.UTF8Encoding]::new($false))
          git -C carrier config user.name cloudscribe-ci
          git -C carrier config user.email actions@github.com
          git -C carrier add .cloudscribe-ci/stage4-batch10/admission-status.txt
          git -C carrier commit -m "ci: record Batch 10 admission $status run $env:GITHUB_RUN_ID"
          if($LASTEXITCODE -eq 0){git -C carrier push origin HEAD:cloudscribe-stage4-batch10-dev}
