name: Dispatch corrected CloudScribe Stage 3 v4 admission r2

on:
  push:
    branches: [cloudscribe-stage3-slice1-10.0.400-carrier]
    paths: ['.github/workflows/cloudscribe-stage3-v4-dispatch.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v4 from current carrier head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudscribe-stage3-slice1-10.0.400-v4.yml --repo sohweiyu2023/CloudScribe-Pro --ref cloudscribe-stage3-slice1-10.0.400-carrier