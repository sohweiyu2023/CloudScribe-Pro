name: CloudScribe 1.0.1 Google TTS comprehensive acceptance

on:
  push:
    branches:
      - hotfix/1.0.1-google-tts-usability

permissions:
  contents: read

jobs:
  comprehensive-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Locked restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }

      - name: Formatting and strict Release build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Formatting gate failed.' }
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Strict Release build failed.' }

      - name: Complete compiled solution tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test CloudScribe.sln -c Release --no-build --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Complete compiled solution test suite failed.' }

      - name: Google TTS 1.0.1 source acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'src/CloudScribe.App/CloudScribe.App.csproj' -Raw
          $properties = $project.Project.PropertyGroup | Select-Object -First 1
          if ($properties.Version -ne '1.0.1') { throw "Version is $($properties.Version), expected 1.0.1." }
          if ($properties.InformationalVersion -ne '1.0.1') { throw "InformationalVersion is $($properties.InformationalVersion), expected 1.0.1." }
          if ($properties.FileVersion -ne '1.0.1.0') { throw "FileVersion is $($properties.FileVersion), expected 1.0.1.0." }
          if ($properties.AssemblyVersion -ne '1.0.0.0') { throw "AssemblyVersion is $($properties.AssemblyVersion), expected compatible 1.0.0.0." }

          @(
            'src/CloudScribe.App/Composition/GoogleTtsUsabilityHotfixBinder.cs',
            'src/CloudScribe.App/Composition/GoogleGenerationAcceptedMp3OutputService.cs',
            'src/CloudScribe.App/ViewModels/ShellViewModel.GoogleTtsStudio.cs',
            'src/CloudScribe.App/ViewModels/ShellViewModel.Stage6GoogleGeneration.cs',
            'src/CloudScribe.Infrastructure/VoiceLab/GoogleServiceAccountCredentialOnboardingService.cs',
            'src/CloudScribe.Infrastructure/VoiceLab/GoogleServiceAccountTokenClient.cs',
            'src/CloudScribe.Infrastructure/VoiceLab/GoogleTextToSpeechCatalogClient.cs',
            'src/CloudScribe.Infrastructure/Generation/GoogleGenerationProvider.cs',
            'src/CloudScribe.Infrastructure/Generation/GoogleGenerationHttpTransport.cs'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Google TTS 1.0.1 runtime component is missing: $_"
            }
          }

          $binder = Get-Content 'src/CloudScribe.App/Composition/GoogleTtsUsabilityHotfixBinder.cs' -Raw
          @(
            'ConfigureGoogleTtsUsabilityHotfix',
            'ConfigureGoogleTtsCredentialOnboarding',
            'ConfigureGoogleTtsCatalogRefresh',
            'ConfigureGoogleGenerationOutputPlayback'
          ) | ForEach-Object {
            if (-not $binder.Contains($_, [System.StringComparison]::Ordinal)) {
              throw "Google TTS usability binder lost required production wiring: $_"
            }
          }

          $stage6 = Get-Content 'src/CloudScribe.App/ViewModels/ShellViewModel.Stage6GoogleGeneration.cs' -Raw
          @(
            'ApproveAndGenerateWithGoogleAsync',
            'ConfirmGenerationSpendAsync',
            'PersistApprovedGoogleGenerationAsync',
            'PersistAcceptedAsync'
          ) | ForEach-Object {
            if (-not $stage6.Contains($_, [System.StringComparison]::Ordinal)) {
              throw "Stage6 guarded Google generation path lost required element: $_"
            }
          }

          $output = Get-Content 'src/CloudScribe.App/Composition/GoogleGenerationAcceptedMp3OutputService.cs' -Raw
          @(
            'response.IsAccepted',
            'response.MediaBytes',
            'SHA256.HashData',
            'CryptographicOperations.FixedTimeEquals',
            '_acceptedPlaybackIntegrity',
            'Verified Google MP3 output changed after acceptance and will not be played.'
          ) | ForEach-Object {
            if (-not $output.Contains($_, [System.StringComparison]::Ordinal)) {
              throw "Accepted-byte MP3 integrity path lost required element: $_"
            }
          }

      - name: Publish Windows 1.0.1 executable and verify embedded version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'cloudscribe-101-publish'
          dotnet publish src/CloudScribe.App/CloudScribe.App.csproj -c Release --no-restore --no-build -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed.' }
          $exe = Join-Path $publish 'CloudScribe.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'CloudScribe.exe was not published.' }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($version.FileVersion -ne '1.0.1.0') { throw "Published FileVersion is $($version.FileVersion)." }
          if (-not $version.ProductVersion.StartsWith('1.0.1', [System.StringComparison]::Ordinal)) {
            throw "Published ProductVersion is $($version.ProductVersion)."
          }
          "CLOUDSCRIBE_101_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Exercise runnable Windows output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath $env:CLOUDSCRIBE_101_EXE -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              if ($process.ExitCode -ne 0) {
                throw "Published CloudScribe.exe exited during startup smoke with code $($process.ExitCode)."
              }
              throw 'Published CloudScribe.exe exited unexpectedly during the startup smoke window.'
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Exact source no-mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (git status --porcelain=v1) {
            git status --short
            throw 'Validation mutated the checked-out source tree.'
          }
