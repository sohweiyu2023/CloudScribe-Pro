name: Repair Stage4 Batch16 helper

on:
  push:
    paths:
      - '.github/ci/stage4_batch16_fix_trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Repair generated C# JSON literal escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/ci/stage4_batch16_bind.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              r'byte[] material = "{\"schemaVersion\":\"1.1.5\"}"u8.ToArray();': r'byte[] material = "{\\\"schemaVersion\\\":\\\"1.1.5\\\"}"u8.ToArray();',
              r'byte[] material = "{\"schemaVersion\":1,\"schemaVersion\":2}"u8.ToArray();': r'byte[] material = "{\\\"schemaVersion\\\":1,\\\"schemaVersion\\\":2}"u8.ToArray();',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count == 0:
                  raise SystemExit(f'expected helper pattern not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- .github/ci/stage4_batch16_bind.py
      - name: Commit exact helper repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/ci/stage4_batch16_bind.py
          git commit -m 'fix(stage4): escape Batch16 generated JSON literals'
          git push origin HEAD:main
