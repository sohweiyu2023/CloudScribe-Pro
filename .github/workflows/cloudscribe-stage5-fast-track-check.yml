name: CloudScribe Stage 5 fast-track check

on:
  push:
    branches:
      - agent/stage5-fast-track

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verify isolated branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = (git branch --show-current).Trim()
          if ($branch -ne 'agent/stage5-fast-track') { throw "Unexpected branch: $branch" }
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Formatting gate failed.' }
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Strict Release build failed.' }
          dotnet test tests/CloudScribe.Domain.Tests/CloudScribe.Domain.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~Stage5GenerationCoreTests|FullyQualifiedName~Stage5ExecutionPolicyTests|FullyQualifiedName~Stage5ReturnedMediaValidationTests|FullyQualifiedName~Stage5PlaybackSessionTests|FullyQualifiedName~Stage5GenerationSafetyTests|FullyQualifiedName~Stage5AudioAssemblyPlanTests|FullyQualifiedName~Stage5PrivateCacheNamespaceTests"
          if ($LASTEXITCODE -ne 0) { throw 'Stage 5 domain/player/safety/audio-assembly/private-cache tests failed.' }
          dotnet test tests/CloudScribe.Application.Tests/CloudScribe.Application.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~Stage5GenerationSegmentExecutorTests|FullyQualifiedName~Stage5NativeMediaBoundaryTests|FullyQualifiedName~Stage5SegmentSchedulerTests|FullyQualifiedName~Stage5TimedTextExporterTests|FullyQualifiedName~Stage5ProofPassTests|FullyQualifiedName~Stage5ReleaseSafetyTests|FullyQualifiedName~Stage5CollectionReleaseCoordinatorTests|FullyQualifiedName~Stage5AudioAssemblyNativePlannerTests|FullyQualifiedName~Stage5AudioAssemblyNativeExecutorTests|FullyQualifiedName~Stage5GenerationReleasePublisherTests|FullyQualifiedName~Stage5GenerationReleaseVerifierTests|FullyQualifiedName~Stage5GenerationReleaseFinalizerTests|FullyQualifiedName~Stage5GenerationReleaseCheckpointTests|FullyQualifiedName~Stage5ReleasePlaybackAcceptanceTests"
          if ($LASTEXITCODE -ne 0) { throw 'Stage 5 application/scheduler/timed-text/native/proof/release/playback tests failed.' }
          dotnet test tests/CloudScribe.Infrastructure.Tests/CloudScribe.Infrastructure.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~Stage5DurabilityAndFakeProviderTests|FullyQualifiedName~Stage5ReleaseCheckpointStoreTests|FullyQualifiedName~Stage5DurableGenerationReleaseFinalizerTests|FullyQualifiedName~Stage5EndToEndGenerationAcceptanceTests|FullyQualifiedName~Stage5PrivateCacheKeyProviderTests|FullyQualifiedName~Stage5PrivateCacheLifecycleTests"
          if ($LASTEXITCODE -ne 0) { throw 'Stage 5 durability/fake-provider/end-to-end/release-checkpoint/private-cache lifecycle tests failed.' }
