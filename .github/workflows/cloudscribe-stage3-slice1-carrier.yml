name: CloudScribe Stage 3 Slice 1 Windows Carrier

on:
  push:
    branches:
      - cloudscribe-stage3-slice1-carrier

permissions:
  contents: write

jobs:
  validate-and-promote-slice:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      EXPECTED_STAGE3_BASE: 59b7cbcf3a4243627a358e996e08e012f478deec
      PAYLOAD_SHA256: 5887f0c6128aacb822fa6c3bf42c6fb2ccd37a31ef3eeaef9a264b0c8193f3d4
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage3-slice1-carrier
          path: carrier
          fetch-depth: 1

      - name: Checkout exact Stage 3 target
        uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.4.0-stage3
          path: target
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Reconstruct and apply hash-bound Stage 3 persistence slice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          carrier = Path('carrier').resolve()
          target = Path('target').resolve()
          payload_dir = carrier / '.cloudscribe-ci' / 'stage3-slice1-payload'
          names = [f'{index:02d}.txt' for index in range(6)]
          encoded = ''.join((payload_dir / name).read_text(encoding='utf-8-sig').strip() for name in names)
          payload = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          expected_hash = '5887f0c6128aacb822fa6c3bf42c6fb2ccd37a31ef3eeaef9a264b0c8193f3d4'
          if actual != expected_hash:
              raise SystemExit(f'payload SHA-256 mismatch: expected={expected_hash} actual={actual}')

          expected_members = {
              '.github/workflows/cloudscribe-stage3-windows.yml',
              'BUILDING-WINDOWS.txt',
              'SESSION_STATE.json',
              'SHA256SUMS.txt',
              'src/CloudScribe.App/CloudScribe.App.csproj',
              'src/CloudScribe.Infrastructure/Configuration/AppPaths.cs',
              'src/CloudScribe.Infrastructure/DependencyInjection/ServiceCollectionExtensions.cs',
              'src/CloudScribe.Infrastructure/Files/DocumentContentStore.cs',
              'src/CloudScribe.Infrastructure/Persistence/CloudScribeDbContext.cs',
              'src/CloudScribe.Infrastructure/Persistence/DatabaseInitializer.cs',
              'src/CloudScribe.Infrastructure/Persistence/EfActivityTimelineStore.cs',
              'src/CloudScribe.Infrastructure/Persistence/EfBillableOperationLedger.cs',
              'src/CloudScribe.Infrastructure/Persistence/Entities/BookmarkEntity.cs',
              'src/CloudScribe.Infrastructure/Persistence/Entities/DocumentEntity.cs',
              'src/CloudScribe.Infrastructure/Persistence/Entities/DocumentRevisionEntity.cs',
              'src/CloudScribe.Infrastructure/Persistence/Entities/DocumentSectionEntity.cs',
              'src/CloudScribe.Infrastructure/Persistence/Entities/DocumentTagEntity.cs',
              'src/CloudScribe.Infrastructure/Persistence/Entities/ReadingPositionEntity.cs',
              'src/CloudScribe.Infrastructure/Persistence/Entities/TagEntity.cs',
              'src/CloudScribe.Infrastructure/Persistence/LegacyDatabaseMigrationBridge.cs',
              'src/CloudScribe.Infrastructure/Persistence/Migrations/20260811125000_Stage2Baseline.cs',
              'src/CloudScribe.Infrastructure/Persistence/Migrations/20260811130000_Stage3Documents.cs',
              'tests/CloudScribe.Architecture.Tests/AdaptiveShellTests.cs',
              'tests/CloudScribe.Infrastructure.Tests/AppPathsTests.cs',
              'tests/CloudScribe.Infrastructure.Tests/DocumentContentStoreTests.cs',
              'tests/CloudScribe.Infrastructure.Tests/ObservabilityPersistenceTests.cs',
              'tests/CloudScribe.Infrastructure.Tests/Stage3MigrationTests.cs',
              'tools/create_source_archive.py',
              'tools/verify_repository.py',
              'tools/verify_stage3_source.py',
          }

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              actual_members = {member.name for member in members}
              if actual_members != expected_members:
                  missing = sorted(expected_members - actual_members)
                  extra = sorted(actual_members - expected_members)
                  raise SystemExit(f'payload inventory mismatch: missing={missing} extra={extra}')
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe payload member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'payload member cannot be read: {member.name}')
                  destination = target.joinpath(*path.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())

          legacy = target / 'src/CloudScribe.Infrastructure/Persistence/ObservabilityDbContext.cs'
          if not legacy.is_file():
              raise SystemExit('expected Stage 2 ObservabilityDbContext preimage is missing')
          legacy.unlink()
          print(f'CLOUDSCRIBE_STAGE3_SLICE1_PAYLOAD=PASS sha256={actual} members={len(expected_members)}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Stage 3 payload application failed: $LASTEXITCODE" }

      - name: Verify source/state contracts before compilation
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_STAGE3_BASE) { throw "Stage 3 base moved before validation: expected=$env:EXPECTED_STAGE3_BASE actual=$head" }
          python tools/update_sha256_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3 source manifest mismatch.' }
          python tools/verify_stage3_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3 source verifier failed.' }
          python tools/verify_repository.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository verifier failed for Stage 3.' }
          $legacy = Get-ChildItem -LiteralPath src,tests -Recurse -File -Include *.cs | Select-String -SimpleMatch 'ObservabilityDbContext'
          if ($legacy) { throw "Live source still references ObservabilityDbContext: $($legacy.Path -join ', ')" }

      - name: Locked restore
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw "Locked restore failed: $LASTEXITCODE" }

      - name: Release build
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "Release build failed: $LASTEXITCODE" }

      - name: Run all compiled test projects
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'tests/CloudScribe.Domain.Tests/CloudScribe.Domain.Tests.csproj',
            'tests/CloudScribe.Application.Tests/CloudScribe.Application.Tests.csproj',
            'tests/CloudScribe.Infrastructure.Tests/CloudScribe.Infrastructure.Tests.csproj',
            'tests/CloudScribe.Architecture.Tests/CloudScribe.Architecture.Tests.csproj'
          )
          foreach ($project in $projects) {
            dotnet test $project -c Release --no-build --no-restore -m:1 -nodeReuse:false -p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $project ($LASTEXITCODE)" }
          }

      - name: Formatting and final source immutability
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet format CloudScribe.sln --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet format verification failed: $LASTEXITCODE" }
          python tools/update_sha256_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest changed during Stage 3 validation.' }

      - name: Commit only the fully green slice to Stage 3
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin cloudscribe-0.4.0-stage3
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh Stage 3 remote head.' }
          $remote = (git rev-parse origin/cloudscribe-0.4.0-stage3).Trim()
          if ($remote -ne $env:EXPECTED_STAGE3_BASE) { throw "Stage 3 branch moved during validation: expected=$env:EXPECTED_STAGE3_BASE actual=$remote" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage 3: add durable document persistence foundation'
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3 slice commit failed.' }
          $commit = (git rev-parse HEAD).Trim()
          git push origin HEAD:refs/heads/cloudscribe-0.4.0-stage3
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3 slice push failed.' }
          Write-Host "CLOUDSCRIBE_STAGE3_SLICE1_WINDOWS=PASS commit=$commit payload_sha256=$env:PAYLOAD_SHA256"
