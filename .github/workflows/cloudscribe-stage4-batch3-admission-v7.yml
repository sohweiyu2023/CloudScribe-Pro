name: CloudScribe Stage 4 foundation batch 3 admission v7

on:
  push:
    branches: [cloudscribe-stage4-batch3-carrier]
    paths:
      - '.github/workflows/cloudscribe-stage4-batch3-admission-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admit:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      BASE_HEAD: 4fbe6dc843c123ea2e769a6e6d0b4524cfb72e62
      TARGET_BRANCH: cloudscribe-0.5.0-stage4
      PRIMARY_SHA256: d9fa22279d7d2787ee8cb4d11a6517c60448a85e458329be35f4607b3488516d
      SECOND_SHA256: c6273bc12897ad92893cf15a88b4d77b416b64ed988697c48be385804eacd579
      REFACTOR_SHA256: 37215b5b111fb2292d766a517abb7ac1289e4a458081af86fe93698b53ff3305
      FORMAT_SHA256: d040ca075a26fe24cff7c47ff9b8b6ac5969c2f9170d6d98f957d31d4423dd7c
      CA1512_SHA256: f6a3a9e1db29779ace7e2793fac438d34d30041caa7ac1b390c39b9691134567
      MIGRATION_TEST_REPAIR_SHA256: 898d48dae2f7ee117ab05cb5a6af494733a59eda06b66aed54c2a734f749bf67
      FINAL_STORE_SHA256: a9a2ac0401bacab1ada8311b270df49b0da2f0ce558f8cef6b1828c8c5a5c38e
      FINAL_ACTIVATION_SHA256: 4ad8929dbad6a8b5b080b68f1ee562d45fa581c6e953eb357c1139dbcee78305
      EXPECTED_CHANGED_FILES: '27'
      EXPECTED_DOTNET_TESTS: '210'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch3-carrier
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: 'source/**/packages.lock.json'

      - name: Reconstruct and bind exact reviewed Batch 3 plus source-quality and migration-test repairs
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          function Require([bool]$c,[string]$m){if(-not $c){throw $m}}
          function Expand-Chunks([IO.FileInfo[]]$chunks,[string]$outPath){
            $encoded=($chunks | Sort-Object Name | ForEach-Object {(Get-Content -LiteralPath $_.FullName -Raw).Trim()}) -join ''
            $gzip=[Convert]::FromBase64String($encoded)
            $input=[IO.MemoryStream]::new($gzip,$false)
            $stream=[IO.Compression.GZipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
            $output=[IO.File]::Create($outPath)
            try {$stream.CopyTo($output)} finally {$output.Dispose();$stream.Dispose();$input.Dispose();[Array]::Clear($gzip)}
          }
          Require ((git rev-parse HEAD).Trim() -eq $env:BASE_HEAD) 'Stage 4 target moved before Batch 3 admission.'
          Require ((dotnet --version).Trim() -eq '10.0.400') 'Wrong .NET SDK.'
          $root=Join-Path $env:GITHUB_WORKSPACE 'carrier\.cloudscribe-ci\stage4-batch3'
          $primary=@(Get-ChildItem -LiteralPath $root -Filter 'batch3-*.b64' -File)
          $second=@(Get-ChildItem -LiteralPath $root -Filter 'second4-*.b64' -File)
          Require ($primary.Count -eq 3) "Expected three primary chunks, found $($primary.Count)."
          Require ($second.Count -eq 7) "Expected seven bounded second-layer chunks, found $($second.Count)."
          $p1=Join-Path $env:RUNNER_TEMP 'stage4-batch3-primary.patch'
          $p2=Join-Path $env:RUNNER_TEMP 'stage4-batch3-second.patch'
          $refactor=Join-Path $root 'batch3-ma0051-refactor.patch'
          $formatRepair=Join-Path $root 'batch3-format-repair.patch'
          $caRepair=Join-Path $root 'batch3-ca1512-repair.patch'
          $migrationTestRepair=Join-Path $root 'batch3-migration-test-contract-repair.patch'
          Expand-Chunks $primary $p1
          Expand-Chunks $second $p2
          $h1=(Get-FileHash -LiteralPath $p1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $h2=(Get-FileHash -LiteralPath $p2 -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3=(Get-FileHash -LiteralPath $refactor -Algorithm SHA256).Hash.ToLowerInvariant()
          $h4=(Get-FileHash -LiteralPath $formatRepair -Algorithm SHA256).Hash.ToLowerInvariant()
          $h5=(Get-FileHash -LiteralPath $caRepair -Algorithm SHA256).Hash.ToLowerInvariant()
          $h6=(Get-FileHash -LiteralPath $migrationTestRepair -Algorithm SHA256).Hash.ToLowerInvariant()
          Require ($h1 -eq $env:PRIMARY_SHA256) "Primary SHA mismatch: $h1"
          Require ($h2 -eq $env:SECOND_SHA256) "Second-layer SHA mismatch: $h2"
          Require ($h3 -eq $env:REFACTOR_SHA256) "MA0051 repair SHA mismatch: $h3"
          Require ($h4 -eq $env:FORMAT_SHA256) "Format repair SHA mismatch: $h4"
          Require ($h5 -eq $env:CA1512_SHA256) "CA1512 repair SHA mismatch: $h5"
          Require ($h6 -eq $env:MIGRATION_TEST_REPAIR_SHA256) "Migration-test repair SHA mismatch: $h6"
          foreach($patch in @($p1,$p2,$refactor,$formatRepair,$caRepair,$migrationTestRepair)){
            git apply --check -- $patch; Require ($LASTEXITCODE -eq 0) "Patch does not apply cleanly: $patch"
            git apply --whitespace=nowarn -- $patch; Require ($LASTEXITCODE -eq 0) "Patch application failed: $patch"
          }
          $storeHash=(Get-FileHash -LiteralPath 'src/CloudScribe.Infrastructure/Pricing/EfPricingCatalogHistoryStore.cs' -Algorithm SHA256).Hash.ToLowerInvariant()
          $activationHash=(Get-FileHash -LiteralPath 'src/CloudScribe.Application/Pricing/PricingCatalogActivationRequest.cs' -Algorithm SHA256).Hash.ToLowerInvariant()
          Require ($storeHash -eq $env:FINAL_STORE_SHA256) "Final EF history-store SHA mismatch: $storeHash"
          Require ($activationHash -eq $env:FINAL_ACTIVATION_SHA256) "Final activation-request SHA mismatch: $activationHash"
          python tools/update_sha256_manifest.py
          Require ($LASTEXITCODE -eq 0) 'Unable to refresh SHA-256 manifest for reviewed Batch 3 repairs.'
          python tools/update_sha256_manifest.py --check
          Require ($LASTEXITCODE -eq 0) 'SHA-256 manifest is not stable after reviewed Batch 3 repairs.'
          $tracked=@(git diff --name-only -- | Where-Object {$_ -and $_.Trim()})
          $untracked=@(git ls-files --others --exclude-standard | Where-Object {$_ -and $_.Trim()})
          $changed=@($tracked + $untracked | Sort-Object -Unique)
          Require ($changed.Count -eq [int]$env:EXPECTED_CHANGED_FILES) "Expected $env:EXPECTED_CHANGED_FILES changed paths, found $($changed.Count)."
          foreach($required in @('SESSION_STATE.json','src/CloudScribe.Application/Pricing/IPricingCatalogHistoryStore.cs','src/CloudScribe.Application/Pricing/PricingCatalogActivationRequest.cs','src/CloudScribe.Infrastructure/Pricing/EfPricingCatalogHistoryStore.cs','src/CloudScribe.Infrastructure/Persistence/Migrations/Stage4PricingCatalogHistory.cs','src/CloudScribe.App/ViewModels/ShellViewModel.Pricing.cs','tests/CloudScribe.Infrastructure.Tests/PricingCatalogHistoryStoreTests.cs','tests/CloudScribe.Infrastructure.Tests/Stage3MigrationTests.cs','tests/CloudScribe.Infrastructure.Tests/DatabaseRecoveryTests.cs','tools/verify_stage4_source.py')){Require ($changed -contains $required) "Missing required Batch 3 path: $required"}
          $forbidden=@($changed | Where-Object {$_ -match '(^|/)(bin|obj|TestResults)(/|$)' -or $_ -match 'packages\.lock\.json$'})
          Require ($forbidden.Count -eq 0) "Forbidden changed paths: $($forbidden -join ', ')"
          git add -A
          $staged=@(git diff --cached --name-only | Where-Object {$_ -and $_.Trim()})
          Require ($staged.Count -eq [int]$env:EXPECTED_CHANGED_FILES) "Expected $env:EXPECTED_CHANGED_FILES staged paths, found $($staged.Count)."
          git diff --cached --check; Require ($LASTEXITCODE -eq 0) 'Batch 3 whitespace check failed.'
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH3 primary=$h1 second=$h2 refactor=$h3 format=$h4 ca1512=$h5 migration_tests=$h6 store=$storeHash activation=$activationHash files=$($changed.Count)"

      - name: Portable governance and mutation gates
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          foreach($command in @('python tools/update_sha256_manifest.py --check','python tools/verify_repository.py','python tools/verify_project_dependencies.py','python tools/verify_stage1_source.py','python tools/verify_stage2_source.py','python tools/verify_stage3_source.py','python tools/verify_stage4_source.py','python -B tools/run_verifier_self_tests.py','python -B tools/run_python_regression_shards.py --all')){
            Write-Host "> $command"; Invoke-Expression $command; if($LASTEXITCODE -ne 0){throw "Gate failed: $command"}
          }

      - name: Locked restore and format verification
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if($LASTEXITCODE -ne 0){throw 'Locked restore failed.'}
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity minimal
          if($LASTEXITCODE -ne 0){throw 'Formatting gate failed.'}

      - name: Release compile with analyzers
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if($LASTEXITCODE -ne 0){throw 'Release compile/analyzer gate failed.'}

      - name: Exact compiled test gate
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'stage4-batch3-tests'; New-Item -ItemType Directory -Force $root | Out-Null
          $projects=@('tests/CloudScribe.Domain.Tests/CloudScribe.Domain.Tests.csproj','tests/CloudScribe.Application.Tests/CloudScribe.Application.Tests.csproj','tests/CloudScribe.Infrastructure.Tests/CloudScribe.Infrastructure.Tests.csproj','tests/CloudScribe.Architecture.Tests/CloudScribe.Architecture.Tests.csproj')
          for($i=0;$i -lt $projects.Count;$i++){
            $results=Join-Path $root $i; New-Item -ItemType Directory -Force $results | Out-Null
            dotnet test $projects[$i] -c Release --no-build --no-restore -m:1 -nodeReuse:false -p:UseSharedCompilation=false --results-directory $results --logger 'trx;LogFileName=stage4-batch3.trx'
            if($LASTEXITCODE -ne 0){throw "Tests failed: $($projects[$i])"}
          }
          $trx=@(Get-ChildItem -LiteralPath $root -Filter '*.trx' -File -Recurse)
          if($trx.Count -ne 4){throw "Expected four TRX files, found $($trx.Count)."}
          $total=0;$passed=0;$failed=0;$skipped=0
          foreach($f in $trx){[xml]$x=Get-Content -LiteralPath $f.FullName -Raw;$c=$x.TestRun.ResultSummary.Counters;$total+=[int]$c.total;$passed+=[int]$c.passed;$failed+=[int]$c.failed;$skipped+=[int]$c.notExecuted}
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH3_DOTNET_TESTS total=$total passed=$passed failed=$failed skipped=$skipped"
          if($total -ne [int]$env:EXPECTED_DOTNET_TESTS -or $passed -ne $total -or $failed -ne 0 -or $skipped -ne 0){throw 'Stage 4 Batch 3 exact compiled-test gate failed.'}

      - name: Post-test stability and publish exact tested Batch 3
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          python tools/update_sha256_manifest.py --check; if($LASTEXITCODE -ne 0){throw 'Manifest drifted during Batch 3 admission.'}
          python tools/verify_stage4_source.py; if($LASTEXITCODE -ne 0){throw 'Stage 4 verifier failed after tests.'}
          git diff --cached --check; if($LASTEXITCODE -ne 0){throw 'Staged source drifted after tests.'}
          dotnet build-server shutdown | Out-Null
          git clean -fdx; if($LASTEXITCODE -ne 0){throw 'Unable to clear generated state.'}
          python tools/update_sha256_manifest.py --check; if($LASTEXITCODE -ne 0){throw 'Tracked source changed during cleanup.'}
          $staged=@(git diff --cached --name-only | Where-Object {$_ -and $_.Trim()})
          if($staged.Count -ne [int]$env:EXPECTED_CHANGED_FILES){throw "Expected $env:EXPECTED_CHANGED_FILES staged paths after cleanup, found $($staged.Count)."}
          $forbidden=@($staged | Where-Object {$_ -match '(^|/)(bin|obj|TestResults)(/|$)' -or $_ -match 'packages\.lock\.json$'})
          if($forbidden.Count -gt 0){throw "Forbidden staged paths after cleanup: $($forbidden -join ', ')"}
          $remote=(git ls-remote --heads origin "refs/heads/$env:TARGET_BRANCH" | Select-Object -First 1)
          if(-not $remote){throw 'Stage 4 target branch disappeared.'}
          $remoteHead=($remote -split '\s+')[0].Trim()
          if($remoteHead -ne $env:BASE_HEAD){throw "Stage 4 target branch moved during admission: $remoteHead"}
          git config user.name cloudscribe-ci; git config user.email actions@github.com
          git commit -m 'feat: Stage 4 persistent catalog history and rollback batch 3'
          if($LASTEXITCODE -ne 0){throw 'Stage 4 Batch 3 commit failed.'}
          $tested=(git rev-parse HEAD).Trim()
          git push origin "${tested}:refs/heads/$env:TARGET_BRANCH"
          if($LASTEXITCODE -ne 0){throw 'Unable to fast-forward exact tested Stage 4 Batch 3.'}
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH3_TESTED_HEAD=$tested"

      - name: Create deterministic admitted source archive
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'stage4-batch3-package'; New-Item -ItemType Directory -Force $package | Out-Null
          python tools/create_source_archive.py --output-directory $package
          if($LASTEXITCODE -ne 0){throw 'Deterministic Stage 4 Batch 3 source archive creation failed.'}

      - name: Upload Stage 4 Batch 3 admission evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch3-admission-v7
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/stage4-batch3-tests/**
            ${{ runner.temp }}/stage4-batch3-package/**
            ${{ runner.temp }}/stage4-batch3-primary.patch
            ${{ runner.temp }}/stage4-batch3-second.patch
            ${{ github.workspace }}/carrier/.cloudscribe-ci/stage4-batch3/batch3-ma0051-refactor.patch
            ${{ github.workspace }}/carrier/.cloudscribe-ci/stage4-batch3/batch3-format-repair.patch
            ${{ github.workspace }}/carrier/.cloudscribe-ci/stage4-batch3/batch3-ca1512-repair.patch
            ${{ github.workspace }}/carrier/.cloudscribe-ci/stage4-batch3/batch3-migration-test-contract-repair.patch
