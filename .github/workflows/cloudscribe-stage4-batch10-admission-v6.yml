name: CloudScribe Stage 4 foundation batch 10 admission v6

on:
  workflow_dispatch:
  push:
    branches: [cloudscribe-stage4-batch10-dev]
    paths: [.github/workflows/cloudscribe-stage4-batch10-admission-v6.yml]

concurrency:
  group: cloudscribe-stage4-batch10-admission-v6
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  admit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch10-dev
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: source/**/packages.lock.json
      - name: Run exact Batch 10 v6 admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='carrier/.cloudscribe-ci/stage4-batch10'
          $part1=Join-Path $root 'admit-v3-01.part'
          $part2=Join-Path $root 'admit-v3-02.part'
          $blob1=(git -C carrier hash-object '.cloudscribe-ci/stage4-batch10/admit-v3-01.part').Trim()
          $blob2=(git -C carrier hash-object '.cloudscribe-ci/stage4-batch10/admit-v3-02.part').Trim()
          if($blob1 -ne 'b5864d8016d51002ce65e2d5f47c6be3ae731d88'){throw "Admission runner part 1 blob mismatch: $blob1"}
          if($blob2 -ne 'b93e43a6e26196b1703c52276d59734d9438c62f'){throw "Admission runner part 2 blob mismatch: $blob2"}
          $script=Join-Path $env:RUNNER_TEMP 'admit-batch10-v6.ps1'
          $text=[IO.File]::ReadAllText($part1)+[IO.File]::ReadAllText($part2)
          [IO.File]::WriteAllText($script,$text,[Text.UTF8Encoding]::new($false))
          & $script -SourceRoot source -CarrierRoot carrier
          if($LASTEXITCODE -ne 0){throw 'Batch 10 v6 admission failed.'}
      - name: Upload Batch 10 v6 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch10-admission-v6
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage4-batch10-v6-tests/**
            ${{ runner.temp }}/stage4-batch10-v6-package/**
            ${{ runner.temp }}/batch10-v6-candidate.patch
