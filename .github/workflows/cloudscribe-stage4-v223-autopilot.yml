name: CloudScribe Stage 4 v2.23 Autopilot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cloudscribe-stage4-v223-autopilot
  cancel-in-progress: false

jobs:
  dispatch-new-stage4-head-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover authoritative Stage 4 head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/stage4-v223-reconciliation" --jq '.object.sha')"
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${head_sha}" >> "${GITHUB_OUTPUT}"
      - name: Require no prior authoritative run for this exact candidate
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/cloudscribe-stage4-v223-admission.yml/runs?branch=agent%2Fstage4-v223-reconciliation&per_page=100" --jq "[.workflow_runs[] | select(.head_sha == \"${HEAD_SHA}\")] | length")"
          if [ "${count}" -gt 0 ]; then
            echo "dispatch=false" >> "${GITHUB_OUTPUT}"
            echo "Exact candidate ${HEAD_SHA} already has an authoritative run; refusing duplicate dispatch."
          else
            echo "dispatch=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Dispatch authoritative certification for new exact candidate
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          MASTER_PACKAGE_PATH: 'C:\CloudScribe-Control\v2.23\CloudScribe_Pro_Master_v2.23.zip'
        run: |
          set -euo pipefail
          gh workflow run cloudscribe-stage4-v223-admission.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref agent/stage4-v223-reconciliation \
            -f master_package_path="${MASTER_PACKAGE_PATH}" \
            -f expected_candidate_sha="${HEAD_SHA}"
          echo "Dispatched exact Stage 4 candidate ${HEAD_SHA}."
