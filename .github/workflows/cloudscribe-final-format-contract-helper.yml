name: CloudScribe Final contract format helper

on:
  push:
    branches:
      - repair/final-1.0.0-shell-integration
    paths:
      - .github/workflows/cloudscribe-final-format-contract-helper.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Verify exact parent and format only Final contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedParent = 'df358d8fb1e00151f3d13796a98bb76f7a3333a5'
          $actualParent = (git rev-parse HEAD^).Trim()
          if ($actualParent -ne $expectedParent) { throw "Refusing repair: parent is $actualParent, expected $expectedParent" }
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet format CloudScribe.sln --no-restore --include tests/CloudScribe.Architecture.Tests/FinalReleaseIntegrationContractTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Targeted formatting failed.' }
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'tests/CloudScribe.Architecture.Tests/FinalReleaseIntegrationContractTests.cs') {
            git status --short
            throw "Unexpected formatted paths: $($changed -join ', ')"
          }

      - name: Commit exact formatting repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'cloudscribe-final-repair-bot'
          git config user.email 'cloudscribe-final-repair-bot@users.noreply.github.com'
          git add -- tests/CloudScribe.Architecture.Tests/FinalReleaseIntegrationContractTests.cs
          git commit -m 'style(final): format compiled integration contract'
          if ($LASTEXITCODE -ne 0) { throw 'Formatting commit failed.' }
          git push origin HEAD:repair/final-1.0.0-shell-integration
          if ($LASTEXITCODE -ne 0) { throw 'Formatting push failed.' }
