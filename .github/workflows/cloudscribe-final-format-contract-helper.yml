name: CloudScribe Final contract format helper

on:
  push:
    branches:
      - repair/final-1.0.0-shell-integration
    paths:
      - .github/workflows/cloudscribe-final-format-contract-helper.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Verify exact parent and format only Final repair C# paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedParent = '3094ec066958269add94f185a849c8b7034f970f'
          $actualParent = (git rev-parse HEAD^).Trim()
          if ($actualParent -ne $expectedParent) { throw "Refusing repair: parent is $actualParent, expected $expectedParent" }
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet format CloudScribe.sln --no-restore --include tests/CloudScribe.Architecture.Tests/FinalReleaseIntegrationContractTests.cs src/CloudScribe.App/ViewModels/ShellViewModel.cs
          if ($LASTEXITCODE -ne 0) { throw 'Targeted formatting failed.' }
          git diff --check
          $allowed = @(
            'tests/CloudScribe.Architecture.Tests/FinalReleaseIntegrationContractTests.cs',
            'src/CloudScribe.App/ViewModels/ShellViewModel.cs'
          )
          $changed = @(git diff --name-only)
          if ($changed.Count -lt 1) {
            throw 'Targeted formatter produced no changes; formatting failure is outside the two recently edited Final C# paths.'
          }
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) {
              git status --short
              throw "Unexpected formatted path: $path"
            }
          }

      - name: Commit exact formatting repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'cloudscribe-final-repair-bot'
          git config user.email 'cloudscribe-final-repair-bot@users.noreply.github.com'
          git add -- tests/CloudScribe.Architecture.Tests/FinalReleaseIntegrationContractTests.cs src/CloudScribe.App/ViewModels/ShellViewModel.cs
          git commit -m 'style(final): format reopened Final integration edits'
          if ($LASTEXITCODE -ne 0) { throw 'Formatting commit failed.' }
          git push origin HEAD:repair/final-1.0.0-shell-integration
          if ($LASTEXITCODE -ne 0) { throw 'Formatting push failed.' }
