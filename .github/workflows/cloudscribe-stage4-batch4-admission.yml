name: CloudScribe Stage 4 foundation batch 4 admission

on:
  push:
    branches:
      - cloudscribe-stage4-batch4-dev
    paths:
      - .github/workflows/cloudscribe-stage4-batch4-admission.yml

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip
  BASE_HEAD: a7895ad3b6053d47a311364aefd6ab6ee7b4cd12
  TARGET_BRANCH: cloudscribe-0.5.0-stage4
  PATCH_SHA256: 5b23db90e4e1b4362e433cc290cace5c467e2b7956adf6c69b8b078aa0bc6adc
  EXPECTED_CHANGED_FILES: '22'
  EXPECTED_DOTNET_TESTS: '222'

jobs:
  admit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch4-dev
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: source/**/packages.lock.json

      - name: Reconstruct exact Batch 4 candidate
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Need([bool]$ok,[string]$message){if(-not $ok){throw $message}}
          Need ((git rev-parse HEAD).Trim() -eq $env:BASE_HEAD) 'Stage 4 target moved before admission.'
          Need ((dotnet --version).Trim() -eq '10.0.400') 'Wrong .NET SDK.'
          $root=Join-Path $env:GITHUB_WORKSPACE 'carrier\.cloudscribe-ci\stage4-batch4'
          $chunks=@(Get-ChildItem $root -Filter 'batch4-*.b64' -File | Sort-Object Name)
          Need ($chunks.Count -eq 15) "Expected 15 Batch 4 chunks; found $($chunks.Count)."
          $expectedSizes=@(1800,1800,1800,1800,1800,1800,1800,1800,1800,1800,1800,1800,1800,1800,92)
          for($i=0;$i -lt $chunks.Count;$i++){Need ($chunks[$i].Length -eq $expectedSizes[$i]) "Carrier chunk size mismatch: $($chunks[$i].Name)=$($chunks[$i].Length)"}
          $text=($chunks|ForEach-Object{(Get-Content $_.FullName -Raw).Trim()}) -join ''
          Need ($text.Length -eq 25292) "Expected 25292 Base64 characters; found $($text.Length)."
          $bytes=[Convert]::FromBase64String($text)
          $input=[IO.MemoryStream]::new($bytes,$false);$gzip=[IO.Compression.GZipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          $patch=Join-Path $env:RUNNER_TEMP 'batch4.patch';$output=[IO.File]::Create($patch)
          try{$gzip.CopyTo($output)}finally{$output.Dispose();$gzip.Dispose();$input.Dispose();[Array]::Clear($bytes)}
          $actual=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant();Need ($actual -eq $env:PATCH_SHA256) "Batch 4 patch SHA mismatch: $actual"
          git apply --check -- $patch;Need ($LASTEXITCODE -eq 0) 'Batch 4 patch does not apply.'
          git apply --whitespace=nowarn -- $patch;Need ($LASTEXITCODE -eq 0) 'Batch 4 patch apply failed.'
          python tools/update_sha256_manifest.py --check;Need ($LASTEXITCODE -eq 0) 'Batch 4 manifest mismatch after reconstruction.'
          $changed=@((git diff --name-only --)+(git ls-files --others --exclude-standard)|Where-Object{$_ -and $_.Trim()}|Sort-Object -Unique)
          Need ($changed.Count -eq [int]$env:EXPECTED_CHANGED_FILES) "Expected $env:EXPECTED_CHANGED_FILES changed paths; found $($changed.Count): $($changed -join ', ')"
          foreach($required in @('SESSION_STATE.json','src/CloudScribe.Application/Pricing/IPricingContractOverrideStore.cs','src/CloudScribe.Infrastructure/Persistence/Migrations/Stage4PricingContractOverrides.cs','src/CloudScribe.Infrastructure/Pricing/EfPricingContractOverrideStore.cs','src/CloudScribe.Providers.Abstractions/ProviderQuotaObservation.cs','tests/CloudScribe.Infrastructure.Tests/PricingContractOverrideStoreTests.cs','tests/CloudScribe.Infrastructure.Tests/ProviderQuotaObservationTests.cs','tools/verify_stage4_source.py')){Need ($changed -contains $required) "Missing required path: $required"}
          $forbidden=@($changed|Where-Object{$_ -match '(^|/)(bin|obj|TestResults)(/|$)' -or $_ -match 'packages\.lock\.json$'});Need ($forbidden.Count -eq 0) "Forbidden paths: $($forbidden -join ', ')"
          git add -A
          Need (@(git diff --cached --name-only|Where-Object{$_ -and $_.Trim()}).Count -eq [int]$env:EXPECTED_CHANGED_FILES) 'Staged path count changed.'
          git diff --cached --check;Need ($LASTEXITCODE -eq 0) 'Whitespace check failed.'
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH4_RECONSTRUCTED files=$($changed.Count) patch=$actual"

      - name: Portable governance and mutation gates
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($command in @('python tools/update_sha256_manifest.py --check','python tools/verify_repository.py','python tools/verify_project_dependencies.py','python tools/verify_stage1_source.py','python tools/verify_stage2_source.py','python tools/verify_stage3_source.py','python tools/verify_stage4_source.py','python -B tools/run_verifier_self_tests.py','python -B tools/run_python_regression_shards.py --all')){Write-Host "> $command";Invoke-Expression $command;if($LASTEXITCODE -ne 0){throw "Gate failed: $command"}}

      - name: Locked restore and format
        working-directory: source
        shell: pwsh
        run: |
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if($LASTEXITCODE -ne 0){throw 'Locked restore failed.'}
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity minimal
          if($LASTEXITCODE -ne 0){throw 'Format gate failed.'}

      - name: Release compile and analyzers
        working-directory: source
        shell: pwsh
        run: |
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if($LASTEXITCODE -ne 0){throw 'Release compiler/analyzer gate failed.'}

      - name: Exact 222 compiled tests
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$root=Join-Path $env:RUNNER_TEMP 'stage4-batch4-tests';New-Item -ItemType Directory -Force $root|Out-Null
          $projects=@('tests/CloudScribe.Domain.Tests/CloudScribe.Domain.Tests.csproj','tests/CloudScribe.Application.Tests/CloudScribe.Application.Tests.csproj','tests/CloudScribe.Infrastructure.Tests/CloudScribe.Infrastructure.Tests.csproj','tests/CloudScribe.Architecture.Tests/CloudScribe.Architecture.Tests.csproj')
          for($i=0;$i -lt $projects.Count;$i++){$dir=Join-Path $root $i;New-Item -ItemType Directory -Force $dir|Out-Null;dotnet test $projects[$i] -c Release --no-build --no-restore -m:1 -nodeReuse:false -p:UseSharedCompilation=false --results-directory $dir --logger 'trx;LogFileName=batch4.trx';if($LASTEXITCODE -ne 0){throw "Tests failed: $($projects[$i])"}}
          $trx=@(Get-ChildItem $root -Filter '*.trx' -File -Recurse);if($trx.Count -ne 4){throw "Expected 4 TRX files; found $($trx.Count)."};$total=0;$passed=0;$failed=0;$skipped=0
          foreach($f in $trx){[xml]$x=Get-Content $f.FullName -Raw;$c=$x.TestRun.ResultSummary.Counters;$total+=[int]$c.total;$passed+=[int]$c.passed;$failed+=[int]$c.failed;$skipped+=[int]$c.notExecuted}
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH4_DOTNET_TESTS total=$total passed=$passed failed=$failed skipped=$skipped"
          if($total -ne [int]$env:EXPECTED_DOTNET_TESTS -or $passed -ne $total -or $failed -ne 0 -or $skipped -ne 0){throw 'Exact compiled-test gate failed.'}

      - name: Post-test stability and publish exact tested Batch 4
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/update_sha256_manifest.py --check;if($LASTEXITCODE -ne 0){throw 'Manifest drifted.'}
          python tools/verify_stage4_source.py;if($LASTEXITCODE -ne 0){throw 'Stage 4 verifier failed after tests.'}
          git diff --cached --check;if($LASTEXITCODE -ne 0){throw 'Staged source drifted.'}
          dotnet build-server shutdown|Out-Null;git clean -fdx;if($LASTEXITCODE -ne 0){throw 'Generated-state cleanup failed.'}
          python tools/update_sha256_manifest.py --check;if($LASTEXITCODE -ne 0){throw 'Tracked source changed during cleanup.'}
          $staged=@(git diff --cached --name-only|Where-Object{$_ -and $_.Trim()});if($staged.Count -ne [int]$env:EXPECTED_CHANGED_FILES){throw "Expected $env:EXPECTED_CHANGED_FILES staged paths after cleanup; found $($staged.Count)."}
          $remote=(git ls-remote --heads origin "refs/heads/$env:TARGET_BRANCH"|Select-Object -First 1);if(-not $remote){throw 'Stage 4 target disappeared.'};$remoteHead=($remote -split '\s+')[0].Trim();if($remoteHead -ne $env:BASE_HEAD){throw "Stage 4 target moved during admission: $remoteHead"}
          git config user.name cloudscribe-ci;git config user.email actions@github.com
          git commit -m 'feat: Stage 4 separate pricing overrides and quota observations batch 4';if($LASTEXITCODE -ne 0){throw 'Batch 4 commit failed.'}
          $tested=(git rev-parse HEAD).Trim();git push origin "${tested}:refs/heads/$env:TARGET_BRANCH";if($LASTEXITCODE -ne 0){throw 'Unable to publish exact tested Batch 4.'}
          Write-Host "CLOUDSCRIBE_STAGE4_BATCH4_TESTED_HEAD=$tested"

      - name: Deterministic admitted source archive
        working-directory: source
        shell: pwsh
        run: |
          $package=Join-Path $env:RUNNER_TEMP 'stage4-batch4-package';New-Item -ItemType Directory -Force $package|Out-Null
          python tools/create_source_archive.py --output-directory $package
          if($LASTEXITCODE -ne 0){throw 'Source archive creation failed.'}

      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch4-admission
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage4-batch4-tests/**
            ${{ runner.temp }}/stage4-batch4-package/**
            ${{ runner.temp }}/batch4.patch
