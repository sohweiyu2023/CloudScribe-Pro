name: CloudScribe Stage 4 Batch 11 repair Windows admission (one-time trigger)

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  admit:
    if: github.event.issue.title == 'TRIGGER-STAGE4-B11-IMMUTABILITY-030ED91D'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      CANDIDATE_HEAD: 030ed91de71fe9dc756081e6ff409dcf9f315fa2
      BASE_HEAD: d59bad2039af0a650ae521a81a238ce39ecb8de7
      CANDIDATE_BRANCH: agent/stage4-batch11-plan-immutability
      EXPECTED_TEST_TOTAL: '261'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 030ed91de71fe9dc756081e6ff409dcf9f315fa2
          path: source
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: 'source/**/packages.lock.json'

      - name: Bind exact candidate and repair scope
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:CANDIDATE_HEAD){throw "Unexpected candidate head: $head"}
          git merge-base --is-ancestor $env:BASE_HEAD $head
          if($LASTEXITCODE -ne 0){throw 'Repair candidate is not descended from the current Stage 4 Batch 11 head.'}
          if((dotnet --version).Trim() -ne '10.0.400'){throw 'Wrong .NET SDK.'}
          $allowed=@(git diff --name-only $env:BASE_HEAD $env:CANDIDATE_HEAD -- | Where-Object { $_ -and $_.Trim() } | Sort-Object -Unique)
          $expected=@(
            'src/CloudScribe.Domain/Pricing/PricingPlanDefinition.cs',
            'tests/CloudScribe.Domain.Tests/PricingPlanDefinitionTests.cs')
          if($allowed.Count -ne $expected.Count){throw "Unexpected repair file count: $($allowed.Count)"}
          foreach($path in $expected){if($allowed -notcontains $path){throw "Missing intended repair file: $path"}}
          foreach($path in $allowed){if($expected -notcontains $path){throw "Unexpected repair file: $path"}}
          [IO.File]::WriteAllLines((Join-Path $env:RUNNER_TEMP 'stage4-b11-repair-allowed.txt'),$allowed,[Text.UTF8Encoding]::new($false))

      - name: Locked restore, formatting and deterministic manifest freeze
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if($LASTEXITCODE -ne 0){throw 'Locked restore failed.'}
          dotnet format CloudScribe.sln --no-restore --verbosity minimal
          if($LASTEXITCODE -ne 0){throw 'Formatting failed.'}
          $postFormat=@(git diff --name-only $env:CANDIDATE_HEAD -- | Where-Object { $_ -and $_.Trim() })
          foreach($path in $postFormat){
            if($path -ne 'src/CloudScribe.Domain/Pricing/PricingPlanDefinition.cs' -and $path -ne 'tests/CloudScribe.Domain.Tests/PricingPlanDefinitionTests.cs'){
              throw "Formatter changed out-of-scope file: $path"
            }
          }
          python tools/update_sha256_manifest.py
          if($LASTEXITCODE -ne 0){throw 'Manifest update failed.'}
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check failed.'}
          git config user.name cloudscribe-ci
          git config user.email actions@github.com
          git add src/CloudScribe.Domain/Pricing/PricingPlanDefinition.cs tests/CloudScribe.Domain.Tests/PricingPlanDefinitionTests.cs SHA256SUMS.txt
          if(-not (git diff --cached --quiet)){
            git commit -m 'chore: freeze Stage 4 Batch 11 repair candidate'
            if($LASTEXITCODE -ne 0){throw 'Candidate freeze commit failed.'}
            git push origin "HEAD:refs/heads/$env:CANDIDATE_BRANCH"
            if($LASTEXITCODE -ne 0){throw 'Candidate freeze push failed.'}
          }
          $tested=(git rev-parse HEAD).Trim()
          "CLOUDSCRIBE_TESTED_HEAD=$tested" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CLOUDSCRIBE_STAGE4_B11_REPAIR_TESTED_HEAD=$tested"
          if((git status --porcelain).Count -ne 0){throw 'Working tree is not clean after candidate freeze.'}

      - name: Full portable governance and Stage 4 regression gates
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $commands=@(
            'python tools/update_sha256_manifest.py --check',
            'python tools/verify_repository.py',
            'python tools/verify_project_dependencies.py',
            'python tools/verify_stage1_source.py',
            'python tools/verify_stage2_source.py',
            'python tools/verify_stage3_source.py',
            'python tools/verify_stage4_source.py',
            'python -B tools/run_verifier_self_tests.py',
            'python -B tools/run_python_regression_shards.py --all')
          foreach($command in $commands){
            Invoke-Expression $command
            if($LASTEXITCODE -ne 0){throw "Gate failed: $command"}
          }

      - name: Strict Release build and analyzers
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if($LASTEXITCODE -ne 0){throw 'Release build/analyzer gate failed.'}

      - name: Native Windows compiled-test admission
        shell: pwsh
        working-directory: source
        env:
          CLOUDSCRIBE_STAGE2_EVIDENCE_DIR: ${{ runner.temp }}\stage4-b11-repair-evidence
          CLOUDSCRIBE_EXPECTED_DOTNET_TEST_TOTAL: '261'
        run: |
          $ErrorActionPreference='Stop'
          pwsh -NoProfile -File scripts/verify-stage2.ps1
          if($LASTEXITCODE -ne 0){throw 'Native Windows regression certification failed.'}

      - name: Exact compiled-test count and source stability
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP 'stage4-b11-repair-evidence'
          $trx=@(Get-ChildItem $evidence -Filter '*.trx' -File -Recurse)
          if($trx.Count -lt 4){throw "Expected at least four TRX files, found $($trx.Count)"}
          $total=0;$passed=0;$failed=0;$skipped=0
          foreach($file in $trx){
            [xml]$xml=Get-Content $file.FullName -Raw
            $c=$xml.TestRun.ResultSummary.Counters
            $total+=[int]$c.total;$passed+=[int]$c.passed;$failed+=[int]$c.failed;$skipped+=[int]$c.notExecuted
          }
          if($total -ne [int]$env:EXPECTED_TEST_TOTAL -or $passed -ne $total -or $failed -ne 0 -or $skipped -ne 0){
            throw "Compiled-test gate failed: total=$total passed=$passed failed=$failed skipped=$skipped expected=$env:EXPECTED_TEST_TOTAL"
          }
          "CLOUDSCRIBE_COMPILED_TEST_TOTAL=$total" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/verify_stage4_source.py
          if($LASTEXITCODE -ne 0){throw 'Stage 4 source verifier failed after tests.'}
          python tools/update_sha256_manifest.py --check
          if($LASTEXITCODE -ne 0){throw 'Manifest changed after tests.'}
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity minimal
          if($LASTEXITCODE -ne 0){throw 'Formatting changed after tests.'}
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff check failed after tests.'}
          if((git status --porcelain).Count -ne 0){git status --short;throw 'Source changed during admission tests.'}
          if((git rev-parse HEAD).Trim() -ne $env:CLOUDSCRIBE_TESTED_HEAD){throw 'HEAD moved during admission.'}

      - name: Special-character launcher regression
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          pwsh -NoProfile -File scripts/test-build-launcher-special-paths.ps1 -SourceRoot (Get-Location).Path -ScratchRoot (Join-Path $env:RUNNER_TEMP 'Stage4 Batch11 Repair (7) & ! literal')
          if($LASTEXITCODE -ne 0){throw 'Special-character launcher regression failed.'}

      - name: Deterministic source archive and evidence summary
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'stage4-b11-repair-package'
          New-Item -ItemType Directory -Force $package | Out-Null
          python tools/create_source_archive.py --output-directory $package
          if($LASTEXITCODE -ne 0){throw 'Deterministic source archive failed.'}
          $zip=Get-ChildItem $package -Filter '*.zip' -File | Select-Object -First 1
          if($null -eq $zip){throw 'Source archive ZIP missing.'}
          $zipHash=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $summary=[ordered]@{
            stage=4
            batch=11
            repair='pricing-plan-meter-immutability'
            run_id='${{ github.run_id }}'
            base_head=$env:BASE_HEAD
            original_candidate_head=$env:CANDIDATE_HEAD
            tested_head=$env:CLOUDSCRIBE_TESTED_HEAD
            dotnet_sdk=(dotnet --version).Trim()
            compiled_tests=[int]$env:CLOUDSCRIBE_COMPILED_TEST_TOTAL
            failed=0
            skipped=0
            source_archive=$zip.Name
            source_archive_sha256=$zipHash
            stage4_promoted=$false
            stage5_started=$false
          }
          $summary | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $package 'STAGE4-BATCH11-REPAIR-ADMISSION.json') -Encoding utf8
          Write-Host "CLOUDSCRIBE_SOURCE_ARCHIVE=$($zip.Name)"
          Write-Host "CLOUDSCRIBE_SOURCE_ARCHIVE_SHA256=$zipHash"

      - name: Upload Batch 11 repair admission evidence and source package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-batch11-repair-admission
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/stage4-b11-repair-evidence/**
            ${{ runner.temp }}/stage4-b11-repair-package/**
            ${{ runner.temp }}/stage4-b11-repair-allowed.txt
