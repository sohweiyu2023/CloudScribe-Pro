name: CloudScribe Stage 4 v2.22 exact-control validation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.issue.title == 'TRIGGER-STAGE4-V222-EXACT-CONTROLS-RAW-2F4F13B5'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: 2f4f13b542f3907721c3de3dca8af877376ffc6c
      EXPECTED_ARCHIVE_SHA256: 32818c608304aca3a76bef7b5ec4aae16e530a01ba4ef5d679d35ea50bd611c1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage4-batch12-exact-pricing-controls
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Bind exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_HEAD) { throw "Unexpected exact-control candidate: $head" }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Starting checkout is not clean.' }

      - name: Restore authenticated archive from raw Git blob
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'controls/v2.22/exact-controls.bundle.zip'
          python -c "import pathlib, subprocess; p=pathlib.Path(r'$path'); p.write_bytes(subprocess.check_output(['git','cat-file','blob','HEAD:' + r'$path']))"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to restore authenticated archive from raw Git blob.' }
          $rawArchive = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Raw Git blob archive SHA256: $rawArchive"
          if ($rawArchive -ne $env:EXPECTED_ARCHIVE_SHA256) { throw "Repository blob is not the authenticated deterministic archive: $rawArchive" }

      - name: Install exact supplied validator dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "jsonschema[format-nongpl]==4.26.0" "rfc8785==0.1.4" "cryptography==49.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install exact supplied validator runtime dependencies.' }

      - name: Exact identities plus supplied validator agreement
        id: controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualArchive = (Get-FileHash 'controls/v2.22/exact-controls.bundle.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualArchive -ne $env:EXPECTED_ARCHIVE_SHA256) { throw "Authenticated control archive mismatch after raw-blob restore: $actualArchive" }
          python tools/verify_exact_v222_controls.py
          if ($LASTEXITCODE -ne 0) { throw 'Exact v2.22 control validation failed.' }

      - name: Repository source hygiene
        id: hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git checkout -- 'controls/v2.22/exact-controls.bundle.zip'
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Validation mutated the source tree.' }

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const body = [
              'STATUS: v2.22 exact-control focused validation (raw Git blob)',
              `Run: ${context.runId}`,
              `Expected head: ${process.env.EXPECTED_HEAD}`,
              `Exact controls: ${{ steps.controls.outcome }}`,
              `Source hygiene: ${{ steps.hygiene.outcome }}`,
              `Job status: ${{ job.status }}`
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
