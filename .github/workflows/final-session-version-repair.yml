name: Final session version repair

on:
  push:
    branches:
      - agent/final-1.0.0-repair-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/final-1.0.0-repair-v3

      - name: Replace only the stale repository version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('SESSION_STATE.json')
          data = p.read_text(encoding='utf-8')
          old = '"repository_version": "0.5.0-stage4-foundation-batch16"'
          new = '"repository_version": "1.0.0"'
          if new in data:
              print('SESSION_STATE.json already has repository_version 1.0.0; no mutation required.')
              raise SystemExit(0)
          if data.count(old) != 1:
              raise SystemExit('Refusing repair: expected stale repository_version occurs other than exactly once.')
          updated = data.replace(old, new, 1)
          p.write_text(updated, encoding='utf-8', newline='\n')
          PY

          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'No repair commit required.'
            exit 0
          fi
          if [[ "$changed" != 'SESSION_STATE.json' ]]; then
            printf 'Unexpected repair mutation:\n%s\n' "$changed" >&2
            exit 1
          fi
          git diff --check

      - name: Commit exact metadata repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SESSION_STATE.json; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'cloudscribe-final-repair'
          git config user.email 'cloudscribe-final-repair@users.noreply.github.com'
          git add -- SESSION_STATE.json
          if [[ "$(git diff --cached --name-only)" != 'SESSION_STATE.json' ]]; then
            echo 'Refusing commit: staged paths are not exactly SESSION_STATE.json.' >&2
            exit 1
          fi
          git commit -m 'fix(final): align session repository version with 1.0.0'
          git push origin HEAD:agent/final-1.0.0-repair-v3
