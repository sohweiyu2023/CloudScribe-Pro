name: CloudScribe Stage 4 admitted v2.22 integration certification

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  certify:
    if: github.event.issue.title == 'TRIGGER-STAGE4-ADMITTED-V222-E34A8FF1'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      BASE_HEAD: e34a8ff14c9a6606e4a5215a69156de62ce2e2fa
      TARGET_BRANCH: agent/stage4-batch12-exact-pricing-controls
      EXPECTED_TEST_TOTAL: '268'

    steps:
      - name: Checkout exact substantive candidate
        uses: actions/checkout@v6
        with:
          ref: agent/stage4-batch12-exact-pricing-controls
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Bind exact starting point
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:BASE_HEAD) { throw "Unexpected Stage 4 integration head: $head" }
          if ((dotnet --version).Trim() -ne '10.0.400') { throw 'Wrong .NET SDK.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Starting checkout is not clean.' }

      - name: Install authenticated validator runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'jsonschema[format-nongpl]==4.26.0' 'rfc8785==0.1.4' 'cryptography==49.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Validator dependency installation failed.' }

      - name: Freeze deterministic source manifest
        id: freeze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Formatting gate failed.' }
          python tools/update_sha256_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Manifest update failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SHA256SUMS.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore(stage4): refresh manifest for admitted v2.22 integration'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to freeze manifest.' }
          }
          $head = (git rev-parse HEAD).Trim()
          "TESTED_HEAD=$head" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "tested_head=$head" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Frozen candidate is not clean.' }

      - name: Complete portable and exact-control governance
        id: portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commands = @(
            'python tools/update_sha256_manifest.py --check',
            'python tools/verify_repository.py',
            'python tools/verify_project_dependencies.py',
            'python tools/verify_stage1_source.py',
            'python tools/verify_stage2_source.py',
            'python tools/verify_stage3_source.py',
            'python tools/verify_stage4_source.py',
            'python tools/verify_exact_v222_controls.py',
            'python -B tools/run_verifier_self_tests.py',
            'python -B tools/run_python_regression_shards.py --all')
          foreach ($command in $commands) {
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) { throw "Gate failed: $command" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed.' }

      - name: Strict Release build and analyzers
        id: release_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Release build/analyzer gate failed.' }

      - name: Native Windows compiled-test and visual admission
        id: native
        shell: pwsh
        env:
          CLOUDSCRIBE_STAGE2_EVIDENCE_DIR: ${{ runner.temp }}\stage4-admitted-v222-evidence
          CLOUDSCRIBE_EXPECTED_DOTNET_TEST_TOTAL: '268'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force $env:CLOUDSCRIBE_STAGE2_EVIDENCE_DIR | Out-Null
          pwsh -NoProfile -File scripts/verify-stage2.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows regression certification failed.' }

      - name: Exact compiled-test count
        id: compiled_count
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $trx = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'stage4-admitted-v222-evidence') -Filter '*.trx' -File -Recurse)
          if ($trx.Count -lt 4) { throw "Expected at least four TRX files, found $($trx.Count)" }
          $total = 0; $passed = 0; $failed = 0; $skipped = 0
          foreach ($file in $trx) {
            [xml]$xml = Get-Content $file.FullName -Raw
            $c = $xml.TestRun.ResultSummary.Counters
            $total += [int]$c.total; $passed += [int]$c.passed; $failed += [int]$c.failed; $skipped += [int]$c.notExecuted
          }
          if ($total -ne [int]$env:EXPECTED_TEST_TOTAL -or $passed -ne $total -or $failed -ne 0 -or $skipped -ne 0) { throw "Compiled-test count failed: total=$total passed=$passed failed=$failed skipped=$skipped" }
          "CLOUDSCRIBE_COMPILED_TEST_TOTAL=$total" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Post-native restore format and source stability
        id: post_native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @((git diff --name-only), (git diff --cached --name-only)) | Where-Object { $_ -and $_.Trim() }
          if ($tracked.Count -ne 0) { $tracked | Write-Host; throw 'Native verification changed tracked files.' }
          foreach ($project in @(Get-ChildItem src,tests -Filter '*.csproj' -File -Recurse)) {
            foreach ($leaf in @('bin','obj')) { $target = Join-Path $project.Directory.FullName $leaf; if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force } }
          }
          $unexpected = @(git ls-files --others --exclude-standard | Where-Object { $_ -and $_.Trim() })
          if ($unexpected.Count -ne 0) { $unexpected | Write-Host; throw 'Unexpected untracked files after native cleanup.' }
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Post-native locked restore failed.' }
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Post-native formatting stability failed.' }
          foreach ($project in @(Get-ChildItem src,tests -Filter '*.csproj' -File -Recurse)) {
            foreach ($leaf in @('bin','obj')) { $target = Join-Path $project.Directory.FullName $leaf; if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force } }
          }
          python tools/update_sha256_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Post-native manifest changed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Post-native diff check failed.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Post-native worktree is not clean.' }

      - name: Special-character launcher regression
        id: launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/test-build-launcher-special-paths.ps1 -SourceRoot (Get-Location).Path -ScratchRoot (Join-Path $env:RUNNER_TEMP 'Stage4 Admitted v222 (7) & ! literal')
          if ($LASTEXITCODE -ne 0) { throw 'Special-character launcher regression failed.' }
          foreach ($project in @(Get-ChildItem src,tests -Filter '*.csproj' -File -Recurse)) {
            foreach ($leaf in @('bin','obj')) { $target = Join-Path $project.Directory.FullName $leaf; if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force } }
          }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Launcher changed source.' }

      - name: Final verifier stability and deterministic archive
        id: final_guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/verify_exact_v222_controls.py
          if ($LASTEXITCODE -ne 0) { throw 'Exact-control final gate failed.' }
          python tools/verify_stage4_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Final Stage 4 source verifier failed.' }
          python tools/update_sha256_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Final manifest check failed.' }
          python -B tools/run_verifier_self_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Final verifier self-tests failed.' }
          python -B tools/run_python_regression_shards.py --all
          if ($LASTEXITCODE -ne 0) { throw 'Final deterministic regressions failed.' }
          $package = Join-Path $env:RUNNER_TEMP 'stage4-admitted-v222-package'
          New-Item -ItemType Directory -Force $package | Out-Null
          python tools/create_source_archive.py --output-directory $package
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic source archive failed.' }
          $zip = Get-ChildItem $package -Filter '*.zip' -File | Select-Object -First 1
          if ($null -eq $zip) { throw 'Source archive ZIP missing.' }
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "CLOUDSCRIBE_SOURCE_ARCHIVE_SHA256=$zipHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ((git rev-parse HEAD).Trim() -ne $env:TESTED_HEAD) { throw 'HEAD moved during certification.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Final exact no-mutation guard failed.' }

      - name: Push exact certified integration candidate
        id: push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git push origin "HEAD:$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish certified integration candidate.' }

      - name: Upload certification evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-admitted-v222-integration-certification
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/stage4-admitted-v222-evidence/**
            ${{ runner.temp }}/stage4-admitted-v222-package/**

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        env:
          TESTED_HEAD: ${{ steps.freeze.outputs.tested_head }}
          SOURCE_ARCHIVE_SHA256: ${{ env.CLOUDSCRIBE_SOURCE_ARCHIVE_SHA256 }}
        with:
          script: |
            const body = [
              `STATUS: Stage 4 admitted v2.22 integration certification`,
              `Run: ${context.runId}`,
              `Tested head: ${process.env.TESTED_HEAD || ''}`,
              `Portable/exact controls: ${{ steps.portable.outcome }}`,
              `Release build: ${{ steps.release_build.outcome }}`,
              `Native Windows: ${{ steps.native.outcome }}`,
              `Compiled count: ${{ steps.compiled_count.outcome }}`,
              `Post-native: ${{ steps.post_native.outcome }}`,
              `Launcher: ${{ steps.launcher.outcome }}`,
              `Final guard: ${{ steps.final_guard.outcome }}`,
              `Push: ${{ steps.push.outcome }}`,
              `Compiled tests: ${process.env.CLOUDSCRIBE_COMPILED_TEST_TOTAL || ''}`,
              `Source archive SHA256: ${process.env.SOURCE_ARCHIVE_SHA256 || ''}`,
              `Artifact ID: ${{ steps.upload.outputs.artifact-id }}`,
              `Job status: ${{ job.status }}`
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
