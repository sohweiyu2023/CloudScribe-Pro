name: CloudScribe Stage 3 Slice 1 Carrier Observer

on:
  pull_request:
    branches:
      - cloudscribe-0.3.48-stage2-promoted

permissions:
  actions: read
  contents: read

jobs:
  observe-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the matching Windows carrier run to succeed
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedHead = context.payload.pull_request.head.sha;
            const workflowId = 'cloudscribe-stage3-slice1-carrier.yml';
            const deadline = Date.now() + 40 * 60 * 1000;
            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'cloudscribe-stage3-slice1-carrier',
                event: 'push',
                per_page: 20,
              });
              const run = response.data.workflow_runs.find(item => item.head_sha === expectedHead);
              if (!run) {
                core.info(`Waiting for Windows carrier run for ${expectedHead}...`);
              } else if (run.status !== 'completed') {
                core.info(`Windows carrier run ${run.id} is ${run.status}; waiting...`);
              } else {
                core.info(`Windows carrier run ${run.id} completed with ${run.conclusion}.`);
                if (run.conclusion !== 'success') {
                  core.setFailed(`Windows carrier run ${run.id} concluded ${run.conclusion}.`);
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed(`Timed out waiting for Windows carrier run for ${expectedHead}.`);
