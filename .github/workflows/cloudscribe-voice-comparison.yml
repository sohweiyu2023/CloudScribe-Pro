name: Voice comparison and guarded samples

on:
  push:
    branches: [feature/voice-comparison-samples, main]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'controls/**'
      - 'HANDOVER*.txt'
      - 'AGENTS.md'
      - 'BUILDING-WINDOWS.txt'
      - 'README.md'
      - 'SHA256SUMS.txt'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'licenses/**'
      - 'scripts/**'
      - '.gitattributes'
      - '.github/triggers/**'
      - '.github/workflows/cloudscribe-voice-comparison.yml'

permissions:
  contents: read

jobs:
  mocked-checks:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Exact candidate and source manifest
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'Checkout does not match the triggering candidate.' }
          python -B tools/update_sha256_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest check failed.' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.402'
      - name: Locked restore
        run: dotnet restore CloudScribe.sln --locked-mode --configfile NuGet.config
      - name: Strict Release build
        run: dotnet build CloudScribe.sln -c Release --no-restore
      - name: Formatting
        run: dotnet format CloudScribe.sln --no-restore --verify-no-changes
      - name: Windows dependency notices and rejection tests
        shell: pwsh
        run: |
          ./scripts/Test-ThirdPartyNotices.ps1 -AppRoot ./src/CloudScribe.App/bin/Release/net10.0 -NoticesRoot ./licenses/third-party
          ./scripts/Test-ThirdPartyNotices-SelfTests.ps1
      - name: Installer package validation and rejection tests
        shell: pwsh
        run: |
          ./scripts/Test-InstallCloudScribe-SelfTests.ps1
          ./scripts/Test-RecoveryAdmissionPolicy-SelfTests.ps1
          ./scripts/Test-ChirpArticlePolicy-SelfTests.ps1
          ./scripts/Test-ChirpReservationResumePolicy-SelfTests.ps1
          ./scripts/Test-CompletionWorkflowGate-SelfTests.ps1 -PythonPath (Get-Command python).Source
      - name: Offline durable completion gate and isolated bridge
        shell: pwsh
        run: |
          Push-Location tools/completion_workflow
          try {
            python -m unittest -v test_completion_register test_gate_cli test_plan_binding
            if ($LASTEXITCODE -ne 0) { throw 'Completion gate offline tests failed.' }
          } finally { Pop-Location }
      - name: Mocked and local tests only
        run: dotnet test --solution CloudScribe.sln -c Release --no-build --no-restore --output Detailed
