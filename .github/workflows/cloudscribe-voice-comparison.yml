name: Voice comparison and guarded samples

on:
  push:
    branches: [feature/voice-comparison-samples]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'controls/**'
      - 'HANDOVER*.txt'
      - 'AGENTS.md'
      - 'BUILDING-WINDOWS.txt'
      - 'README.md'
      - 'SHA256SUMS.txt'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'licenses/**'
      - 'scripts/**'
      - '.gitattributes'
      - '.github/triggers/**'
      - '.github/workflows/cloudscribe-voice-comparison.yml'

permissions:
  contents: read

jobs:
  mocked-checks:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - name: Locked restore
        run: dotnet restore CloudScribe.sln --locked-mode --configfile NuGet.config
      - name: Strict Release build
        run: dotnet build CloudScribe.sln -c Release --no-restore
      - name: Formatting
        run: dotnet format CloudScribe.sln --no-restore --verify-no-changes
      - name: Windows dependency notices and rejection tests
        shell: pwsh
        run: |
          ./scripts/Test-ThirdPartyNotices.ps1 -AppRoot ./src/CloudScribe.App/bin/Release/net10.0 -NoticesRoot ./licenses/third-party
          ./scripts/Test-ThirdPartyNotices-SelfTests.ps1
      - name: Mocked and local tests only
        run: dotnet test CloudScribe.sln -c Release --no-build --no-restore --logger "console;verbosity=normal"
