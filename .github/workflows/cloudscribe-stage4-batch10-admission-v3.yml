name: CloudScribe Stage 4 foundation batch 10 admission v3
# registration trigger v2

on:
  workflow_dispatch:
  push:
    branches: [cloudscribe-stage4-batch10-dev]
    paths: [.github/workflows/cloudscribe-stage4-batch10-admission-v3.yml]

permissions:
  contents: write

jobs:
  admit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch10-dev
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: source/**/packages.lock.json
      - name: Run exact Batch 10 v3 admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='carrier/.cloudscribe-ci/stage4-batch10'
          $script=Join-Path $env:RUNNER_TEMP 'admit-batch10-v3.ps1'
          $text=[IO.File]::ReadAllText((Join-Path $root 'admit-v3-01.part'))+[IO.File]::ReadAllText((Join-Path $root 'admit-v3-02.part'))
          [IO.File]::WriteAllText($script,$text,[Text.UTF8Encoding]::new($false))
          $sha=(Get-FileHash $script -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'b62096d1bc7b5524a29540bc63468f0a9c8b1d22a7111374f2ed455d13fcfc79'){throw "Admission script SHA mismatch: $sha"}
          & $script -SourceRoot source -CarrierRoot carrier
          if($LASTEXITCODE -ne 0){throw 'Batch 10 v3 admission failed.'}
      - name: Upload Batch 10 v3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch10-admission-v3
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage4-batch10-v3-tests/**
            ${{ runner.temp }}/stage4-batch10-v3-package/**
            ${{ runner.temp }}/batch10-v3-candidate.patch
