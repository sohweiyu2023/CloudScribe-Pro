name: CloudScribe Stage 4 foundation batch 10 admission v4
# registration trigger v2

on:
  workflow_dispatch:
  push:
    branches: [cloudscribe-stage4-batch10-dev]
    paths: [.github/workflows/cloudscribe-stage4-batch10-admission-v3.yml]

permissions:
  contents: write

jobs:
  admit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch10-dev
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: source/**/packages.lock.json
      - name: Run exact Batch 10 v4 admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='carrier/.cloudscribe-ci/stage4-batch10'
          $part1=Join-Path $root 'admit-v3-01.part'
          $part2=Join-Path $root 'admit-v3-02.part'
          $blob1=(git -C carrier hash-object '.cloudscribe-ci/stage4-batch10/admit-v3-01.part').Trim()
          $blob2=(git -C carrier hash-object '.cloudscribe-ci/stage4-batch10/admit-v3-02.part').Trim()
          if($blob1 -ne '17332a75c9a9fddada436c31492b4e6825991482'){throw "Admission runner part 1 blob mismatch: $blob1"}
          if($blob2 -ne 'd2ce23e6708192450310dc9f68b4ae8050029b0d'){throw "Admission runner part 2 blob mismatch: $blob2"}
          $script=Join-Path $env:RUNNER_TEMP 'admit-batch10-v4.ps1'
          $text=[IO.File]::ReadAllText($part1)+[IO.File]::ReadAllText($part2)
          [IO.File]::WriteAllText($script,$text,[Text.UTF8Encoding]::new($false))
          & $script -SourceRoot source -CarrierRoot carrier
          if($LASTEXITCODE -ne 0){throw 'Batch 10 v4 admission failed.'}
      - name: Upload Batch 10 v4 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch10-admission-v4
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage4-batch10-v3-tests/**
            ${{ runner.temp }}/stage4-batch10-v3-package/**
            ${{ runner.temp }}/batch10-v3-candidate.patch
