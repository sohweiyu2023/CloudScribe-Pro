name: CloudScribe Stage 4 admitted v2.22 repair check

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  validate:
    if: github.event.issue.title == 'TRIGGER-STAGE4-ADMITTED-V222-REPAIR-5935EF21'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      EXPECTED_HEAD: 5935ef2110b76235ef626ac8b3340952d6ec4210
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage4-batch12-exact-pricing-controls
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Exact head and formatting
        id: format
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_HEAD) { throw 'Unexpected candidate head.' }
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Formatting gate failed.' }
      - name: Strict Release compile
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Strict Release build failed.' }
      - name: Admitted v2.22 contract tests
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test tests/CloudScribe.Infrastructure.Tests/CloudScribe.Infrastructure.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~AdmittedV222PricingCatalogContractValidatorTests
          if ($LASTEXITCODE -ne 0) { throw 'Admitted v2.22 contract tests failed.' }
      - name: Report result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const body = [
              `STATUS: Stage 4 admitted v2.22 repair check`,
              `Run: ${context.runId}`,
              `Formatting: ${{ steps.format.outcome }}`,
              `Release build: ${{ steps.build.outcome }}`,
              `Contract tests: ${{ steps.tests.outcome }}`,
              `Job status: ${{ job.status }}`
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

  certify_full:
    if: github.event.issue.title == 'TRIGGER-STAGE4-ADMITTED-V222-FULL-ISSUE-5935EF21'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      BASE_HEAD: 5935ef2110b76235ef626ac8b3340952d6ec4210
      TARGET_BRANCH: agent/stage4-batch12-exact-pricing-controls
      EXPECTED_TEST_TOTAL: '268'
      EVIDENCE_DIR: ${{ runner.temp }}\stage4-admitted-v222-full-evidence
      PACKAGE_DIR: ${{ runner.temp }}\stage4-admitted-v222-full-package
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage4-batch12-exact-pricing-controls
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install exact validator dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'jsonschema[format-nongpl]==4.26.0' 'rfc8785==0.1.4' 'cryptography==49.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Validator dependency install failed.' }
      - name: Full Stage 4 admitted-control certification
        id: certify_all
        shell: pwsh
        env:
          CLOUDSCRIBE_STAGE2_EVIDENCE_DIR: ${{ runner.temp }}\stage4-admitted-v222-full-evidence
          CLOUDSCRIBE_EXPECTED_DOTNET_TEST_TOTAL: '268'
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked([string]$Command) {
            Write-Host "=== $Command ==="
            Invoke-Expression $Command
            if ($LASTEXITCODE -ne 0) { throw "Gate failed: $Command" }
          }
          function Remove-BuildIntermediates {
            foreach ($project in @(Get-ChildItem src,tests -Filter '*.csproj' -File -Recurse)) {
              foreach ($leaf in @('bin','obj')) {
                $target = Join-Path $project.Directory.FullName $leaf
                if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
              }
            }
          }

          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:BASE_HEAD) { throw "Unexpected candidate head: $head" }
          if ((dotnet --version).Trim() -ne '10.0.400') { throw 'Wrong .NET SDK.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Starting checkout is not clean.' }

          Invoke-Checked 'dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config'
          Invoke-Checked 'dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic'
          Invoke-Checked 'python tools/update_sha256_manifest.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SHA256SUMS.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'chore(stage4): freeze admitted v2.22 integration manifest'
            if ($LASTEXITCODE -ne 0) { throw 'Manifest freeze commit failed.' }
          }
          $testedHead = (git rev-parse HEAD).Trim()
          "TESTED_HEAD=$testedHead" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Frozen candidate is not clean.' }

          Invoke-Checked 'python tools/update_sha256_manifest.py --check'
          Invoke-Checked 'python tools/verify_repository.py'
          Invoke-Checked 'python tools/verify_project_dependencies.py'
          Invoke-Checked 'python tools/verify_stage1_source.py'
          Invoke-Checked 'python tools/verify_stage2_source.py'
          Invoke-Checked 'python tools/verify_stage3_source.py'
          Invoke-Checked 'python tools/verify_stage4_source.py'
          Invoke-Checked 'python tools/verify_exact_v222_controls.py'
          Invoke-Checked 'python -B tools/run_verifier_self_tests.py'
          Invoke-Checked 'python -B tools/run_python_regression_shards.py --all'
          Invoke-Checked 'git diff --check'
          Invoke-Checked 'dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false'

          New-Item -ItemType Directory -Force $env:CLOUDSCRIBE_STAGE2_EVIDENCE_DIR | Out-Null
          Invoke-Checked 'pwsh -NoProfile -File scripts/verify-stage2.ps1'

          $trx = @(Get-ChildItem $env:CLOUDSCRIBE_STAGE2_EVIDENCE_DIR -Filter '*.trx' -File -Recurse)
          if ($trx.Count -lt 4) { throw "Expected at least four TRX files, found $($trx.Count)" }
          $total = 0; $passed = 0; $failed = 0; $skipped = 0
          foreach ($file in $trx) {
            [xml]$xml = Get-Content $file.FullName -Raw
            $c = $xml.TestRun.ResultSummary.Counters
            $total += [int]$c.total; $passed += [int]$c.passed; $failed += [int]$c.failed; $skipped += [int]$c.notExecuted
          }
          if ($total -ne [int]$env:EXPECTED_TEST_TOTAL -or $passed -ne $total -or $failed -ne 0 -or $skipped -ne 0) { throw "Compiled-test count failed: total=$total passed=$passed failed=$failed skipped=$skipped" }
          "CLOUDSCRIBE_COMPILED_TEST_TOTAL=$total" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $tracked = @((git diff --name-only), (git diff --cached --name-only)) | Where-Object { $_ -and $_.Trim() }
          if ($tracked.Count -ne 0) { $tracked | Write-Host; throw 'Native verification changed tracked files.' }
          Remove-BuildIntermediates
          $unexpected = @(git ls-files --others --exclude-standard | Where-Object { $_ -and $_.Trim() })
          if ($unexpected.Count -ne 0) { $unexpected | Write-Host; throw 'Unexpected untracked files after native cleanup.' }
          Invoke-Checked 'dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config'
          Invoke-Checked 'dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic'
          Remove-BuildIntermediates
          Invoke-Checked 'python tools/update_sha256_manifest.py --check'
          Invoke-Checked 'git diff --check'
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Post-native worktree is not clean.' }

          Invoke-Checked "pwsh -NoProfile -File scripts/test-build-launcher-special-paths.ps1 -SourceRoot '$((Get-Location).Path)' -ScratchRoot '$((Join-Path $env:RUNNER_TEMP 'Stage4 Admitted v222 issue full (9) & ! literal'))'"
          Remove-BuildIntermediates
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Launcher changed source.' }

          Invoke-Checked 'python tools/verify_exact_v222_controls.py'
          Invoke-Checked 'python tools/verify_stage4_source.py'
          Invoke-Checked 'python tools/update_sha256_manifest.py --check'
          Invoke-Checked 'python -B tools/run_verifier_self_tests.py'
          Invoke-Checked 'python -B tools/run_python_regression_shards.py --all'
          New-Item -ItemType Directory -Force $env:PACKAGE_DIR | Out-Null
          Invoke-Checked "python tools/create_source_archive.py --output-directory '$env:PACKAGE_DIR'"
          $zip = Get-ChildItem $env:PACKAGE_DIR -Filter '*.zip' -File | Select-Object -First 1
          if ($null -eq $zip) { throw 'Source archive ZIP missing.' }
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "CLOUDSCRIBE_SOURCE_ARCHIVE_SHA256=$zipHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ((git rev-parse HEAD).Trim() -ne $env:TESTED_HEAD) { throw 'HEAD moved during certification.' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { git status --short; throw 'Final exact no-mutation guard failed.' }

          Invoke-Checked "git push origin HEAD:$env:TARGET_BRANCH"
      - name: Upload certification evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-admitted-v222-full-certification-issue-fallback
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/stage4-admitted-v222-full-evidence/**
            ${{ runner.temp }}/stage4-admitted-v222-full-package/**
      - name: Report full certification result
        if: always()
        uses: actions/github-script@v8
        env:
          TESTED_HEAD: ${{ env.TESTED_HEAD }}
          SOURCE_ARCHIVE_SHA256: ${{ env.CLOUDSCRIBE_SOURCE_ARCHIVE_SHA256 }}
        with:
          script: |
            const body = [
              `STATUS: Stage 4 admitted v2.22 full certification issue fallback`,
              `Run: ${context.runId}`,
              `Tested head: ${process.env.TESTED_HEAD || ''}`,
              `Complete certification: ${{ steps.certify_all.outcome }}`,
              `Compiled tests: ${process.env.CLOUDSCRIBE_COMPILED_TEST_TOTAL || ''}`,
              `Source archive SHA256: ${process.env.SOURCE_ARCHIVE_SHA256 || ''}`,
              `Artifact ID: ${{ steps.upload.outputs.artifact-id }}`,
              `Job status: ${{ job.status }}`
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
