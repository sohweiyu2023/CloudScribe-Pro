name: CloudScribe 0.3.48 Editor Brush Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/cloudscribe-048-adaptive-shell-diagnostic.yml'
      - '.cloudscribe-ci/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct exact repaired source and inspect editor brush failure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'src'; New-Item -ItemType Directory -Path $root -Force | Out-Null
          function Join-Carrier([string]$folder,[string[]]$names,[string]$out,[string]$expectedSha) {
            $s=[IO.File]::Open($out,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try { foreach($n in $names){ $b=[IO.File]::ReadAllBytes((Join-Path $folder $n)); $s.Write($b,0,$b.Length) } } finally { $s.Dispose() }
            $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant(); if($sha -ne $expectedSha){throw "carrier hash mismatch for ${folder}: $sha"}
            & tar.exe -xJf $out -C $root; if($LASTEXITCODE -ne 0){throw "carrier extract failed: $folder"}
          }
          Join-Carrier '.cloudscribe-ci/payload' @('000.bin','001.bin','002.bin','003.bin','004.bin','005.bin','006.bin','007a.bin','007b.bin','008.bin','009.bin','010a.bin','010b.bin','011a.bin','011b.bin') (Join-Path $env:RUNNER_TEMP 'base.tar.xz') '1649cdfaa71f10ce4803fd468285295bf597cb805bf594dd542c386fa04fcd3b'
          Join-Carrier '.cloudscribe-ci/fixtures' @('000.bin','001.bin','002.bin') (Join-Path $env:RUNNER_TEMP 'fixtures.tar.xz') 'a866788937570bd4be228c76035b170aec47d929712e96d7a08b9152239a6d11'
          Join-Carrier '.cloudscribe-ci/hotfix' @('000.bin','001.bin','002s_00.bin','002s_01.bin','002s_02.bin','002s_03.bin','002s_04.bin','002s_05.bin','002s_06.bin') (Join-Path $env:RUNNER_TEMP 'hotfix.tar.xz') '7d64e649b9f3f2d8480d3f093da8eebc3caf01a89e92e4a4b006891c4e43e6aa'
          $carrierCommit='54e1882557b13e8ea548c568995c94807dce23f8'; $carrierRoot="https://raw.githubusercontent.com/sohweiyu2023/CloudScribe-Pro/$carrierCommit/.cloudscribe-ci/focus-fix-carrier"
          $b64=Join-Path $env:RUNNER_TEMP 'focus.b64'; $xz=Join-Path $env:RUNNER_TEMP 'focus.tar.xz'; Remove-Item $b64,$xz -Force -ErrorAction SilentlyContinue
          foreach($part in @('000.b64','001.b64','002.b64','003.b64')) { $partPath=Join-Path $env:RUNNER_TEMP $part; Invoke-WebRequest -Uri "$carrierRoot/$part" -OutFile $partPath; [IO.File]::AppendAllText($b64,([IO.File]::ReadAllText($partPath)).Trim()) }
          [IO.File]::WriteAllBytes($xz,[Convert]::FromBase64String([IO.File]::ReadAllText($b64))); $focusSha=(Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($focusSha -ne 'd182d7686fe80b863d8986c2170464efc22aaff4ec584167d804d3a82cf620d6'){throw "focus hash mismatch: $focusSha"}; & tar.exe -xJf $xz -C $root; if($LASTEXITCODE -ne 0){throw 'focus extract failed'}
          Write-Host '=== MainWindow.VisualCapture.cs ==='
          $capture=Join-Path $root 'src/CloudScribe.App/MainWindow.VisualCapture.cs'; $lines=Get-Content -LiteralPath $capture; for($i=1;$i -le $lines.Count;$i++){ '{0,4}: {1}' -f $i,$lines[$i-1] }
          Write-Host '=== broad editor/brush/contrast matches ==='
          Get-ChildItem -LiteralPath $root -Recurse -File | Select-String -Pattern 'editor|brush|contrast|foreground|background|SolidColor|ISolidColor|InvalidOperationException' | ForEach-Object { "{0}:{1}: {2}" -f $_.Path.Substring($root.Length+1),$_.LineNumber,$_.Line.Trim() }
          Write-Host 'EDITOR_BRUSH_DIAGNOSTIC_COMPLETE'
