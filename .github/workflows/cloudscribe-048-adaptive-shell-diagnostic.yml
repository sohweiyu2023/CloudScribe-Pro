name: CloudScribe 0.3.48 Editor Brush Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/cloudscribe-048-adaptive-shell-diagnostic.yml'
      - '.cloudscribe-ci/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct exact focus-fix carrier and inspect editor brush audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $carrierCommit='54e1882557b13e8ea548c568995c94807dce23f8'
          $carrierRoot="https://raw.githubusercontent.com/sohweiyu2023/CloudScribe-Pro/$carrierCommit/.cloudscribe-ci/focus-fix-carrier"
          $b64=Join-Path $env:RUNNER_TEMP 'focus.b64'
          $xz=Join-Path $env:RUNNER_TEMP 'focus.tar.xz'
          Remove-Item $b64,$xz -Force -ErrorAction SilentlyContinue
          foreach($part in @('000.b64','001.b64','002.b64','003.b64')) {
            $partPath=Join-Path $env:RUNNER_TEMP $part
            Invoke-WebRequest -Uri "$carrierRoot/$part" -OutFile $partPath
            [IO.File]::AppendAllText($b64,([IO.File]::ReadAllText($partPath)).Trim())
          }
          [IO.File]::WriteAllBytes($xz,[Convert]::FromBase64String([IO.File]::ReadAllText($b64)))
          if((Get-Item $xz).Length -ne 42108){throw 'focus carrier length mismatch'}
          $sha=(Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'd182d7686fe80b863d8986c2170464efc22aaff4ec584167d804d3a82cf620d6'){throw "focus carrier hash mismatch: $sha"}
          $root=Join-Path $env:RUNNER_TEMP 'focus-overlay'; New-Item -ItemType Directory -Path $root -Force | Out-Null
          & tar.exe -xJf $xz -C $root; if($LASTEXITCODE -ne 0){throw 'focus carrier extract failed'}
          Write-Host '=== focus carrier files ==='
          Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object { Write-Host $_.FullName.Substring($root.Length+1) }
          Write-Host '=== solid editor surface error context ==='
          $matches=Get-ChildItem -LiteralPath $root -Recurse -File | Select-String -SimpleMatch 'solid editor surface background brush'
          if(-not $matches){throw 'expected editor surface error message not found in focus carrier'}
          foreach($m in $matches){
            $lines=Get-Content -LiteralPath $m.Path
            $from=[Math]::Max(1,$m.LineNumber-25); $to=[Math]::Min($lines.Count,$m.LineNumber+25)
            for($i=$from;$i -le $to;$i++){ '{0,4}: {1}' -f $i,$lines[$i-1] }
          }
          Write-Host '=== editor/theme resource context ==='
          Get-ChildItem -LiteralPath $root -Recurse -File | Select-String -Pattern 'EditorSurface|DocumentEditor|TextBox|ISolidColorBrush|SolidColorBrush' | ForEach-Object { "{0}:{1}: {2}" -f $_.Path.Substring($root.Length+1),$_.LineNumber,$_.Line.Trim() }
