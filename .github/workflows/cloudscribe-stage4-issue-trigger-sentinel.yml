name: CloudScribe Stage 4 issue-trigger sentinel

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  sentinel:
    if: github.event.issue.title == 'TRIGGER-STAGE4-ISSUE-SENTINEL'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report issue trigger success
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `SENTINEL: PASS\nRun: ${context.runId}\nWorkflow SHA: ${context.sha}`
            });
