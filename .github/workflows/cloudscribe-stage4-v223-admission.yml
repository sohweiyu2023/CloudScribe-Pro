name: CloudScribe Stage 4 v2.23 Admission and Full Certification

on:
  workflow_dispatch:
    inputs:
      master_package_path:
        description: Absolute path to the authenticated CloudScribe Pro v2.23 master ZIP on the Windows runner
        required: true
        type: string
      expected_candidate_sha:
        description: Exact 40-character Stage 4 candidate commit SHA intended for certification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudscribe-stage4-v223-certification
  cancel-in-progress: false

jobs:
  v223-control-admission:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact Stage 4 candidate identity
        shell: pwsh
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        run: |
          if ($env:EXPECTED_CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Expected candidate SHA must be exact lowercase 40-character hex.' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_CANDIDATE_SHA) { throw 'Checked-out candidate does not match the explicitly dispatched SHA.' }
          if (@(git status --porcelain=v1).Count -ne 0) { throw 'Exact candidate checkout is not completely clean before authoritative ancestry verification.' }
          git fetch --no-tags origin refs/heads/agent/stage4-v223-reconciliation:refs/remotes/origin/agent/stage4-v223-reconciliation
          if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh the authoritative Stage 4 reconciliation branch ref.' }
          git merge-base --is-ancestor $head refs/remotes/origin/agent/stage4-v223-reconciliation
          if ($LASTEXITCODE -ne 0) { throw 'Explicit candidate SHA is not reachable from the current authoritative Stage 4 reconciliation branch.' }
          if (@(git status --porcelain=v1).Count -ne 0) { throw 'Authoritative ancestry verification changed or introduced candidate files.' }
      - name: Verify exact repository object integrity
        shell: pwsh
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        run: |
          ./tools/Test-Stage4V223RepositoryIntegrity.ps1 -ExpectedCandidateSha $env:EXPECTED_CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Stage 4 repository object integrity gate failed.' }
      - name: Preflight exact Windows certification runner and package path
        shell: pwsh
        env:
          CLOUDSCRIBE_V223_MASTER_PACKAGE: ${{ inputs.master_package_path }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        run: |
          ./tools/Test-Stage4V223RunnerPreflight.ps1 -MasterPackagePath $env:CLOUDSCRIBE_V223_MASTER_PACKAGE -ExpectedCandidateSha $env:EXPECTED_CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Stage 4 v2.23 runner preflight failed.' }
      - name: Admit exact certification environment
        shell: pwsh
        env:
          CLOUDSCRIBE_V223_MASTER_PACKAGE: ${{ inputs.master_package_path }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        run: |
          ./scripts/Test-Stage4V223CertificationEnvironment.ps1 -ExpectedCandidateSha $env:EXPECTED_CANDIDATE_SHA -MasterPackagePath $env:CLOUDSCRIBE_V223_MASTER_PACKAGE
          if ($LASTEXITCODE -ne 0) { throw 'Stage 4 v2.23 certification environment gate failed.' }
      - name: Run fail-closed Stage 4 v2.23 certification preparation
        shell: pwsh
        env:
          CLOUDSCRIBE_V223_MASTER_PACKAGE: ${{ inputs.master_package_path }}
          CLOUDSCRIBE_STAGE4_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        run: |
          $result = ./tools/Invoke-Stage4V223Certification.ps1 -MasterPackagePath $env:CLOUDSCRIBE_V223_MASTER_PACKAGE -CandidateSha $env:CLOUDSCRIBE_STAGE4_CANDIDATE_SHA | ConvertFrom-Json
          if (-not $result.AdmissionPassed -or -not $result.CandidateUnchanged) { throw 'v2.23 admission failed closed.' }
      - name: Preserve candidate identity
        id: candidate
        shell: pwsh
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_CANDIDATE_SHA) { throw 'Candidate identity changed after admission.' }
          if (@(git status --porcelain=v1).Count -ne 0) { throw 'Candidate worktree changed or gained untracked files after admission.' }
          "candidate_sha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  full-windows-certification:
    needs: v223-control-admission
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    outputs:
      certified_sha: ${{ steps.certified.outputs.certified_sha }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ADMITTED_SHA: ${{ needs.v223-control-admission.outputs.candidate_sha }}
      CLOUDSCRIBE_V223_MASTER_PACKAGE: ${{ inputs.master_package_path }}
    steps:
      - name: Checkout admitted candidate exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.v223-control-admission.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify admitted repository object integrity
        shell: pwsh
        run: |
          ./tools/Test-Stage4V223RepositoryIntegrity.ps1 -ExpectedCandidateSha $env:ADMITTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Admitted candidate repository integrity failed before full certification.' }
      - name: Re-preflight certification runner and authenticated package
        shell: pwsh
        run: |
          ./tools/Test-Stage4V223RunnerPreflight.ps1 -MasterPackagePath $env:CLOUDSCRIBE_V223_MASTER_PACKAGE -ExpectedCandidateSha $env:ADMITTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Full certification runner/package preflight failed.' }
      - name: Re-admit exact certification environment
        shell: pwsh
        run: |
          ./scripts/Test-Stage4V223CertificationEnvironment.ps1 -ExpectedCandidateSha $env:ADMITTED_SHA -MasterPackagePath $env:CLOUDSCRIBE_V223_MASTER_PACKAGE
          if ($LASTEXITCODE -ne 0) { throw 'Full certification environment gate failed.' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Certify admitted candidate without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:ADMITTED_SHA) { throw 'Full certification is not running the admitted candidate SHA.' }
          dotnet restore CloudScribe.sln --locked-mode --disable-parallel --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet format CloudScribe.sln --no-restore --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Formatting gate failed.' }
          dotnet build CloudScribe.sln -c Release --no-restore --disable-build-servers -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Strict Release build failed.' }
          dotnet test CloudScribe.sln -c Release --no-build --no-restore --disable-build-servers -m:1
          if ($LASTEXITCODE -ne 0) { throw 'Full test suite failed.' }
          python -m pytest tests/test_verification_tools.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Verification-tool tests failed.' }
          if (@(git status --porcelain=v1).Count -ne 0) { throw 'Certification changed or introduced candidate files.' }
          if ((git rev-parse HEAD).Trim() -ne $env:ADMITTED_SHA) { throw 'Candidate SHA changed during certification.' }
      - name: Reverify repository integrity after full certification
        shell: pwsh
        run: |
          ./tools/Test-Stage4V223RepositoryIntegrity.ps1 -ExpectedCandidateSha $env:ADMITTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Repository integrity failed after full certification.' }
      - name: Publish exact certified candidate identity
        id: certified
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:ADMITTED_SHA) { throw 'Certified SHA differs from admitted SHA.' }
          "certified_sha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  no-change-promotion-readiness:
    needs: [v223-control-admission, full-windows-certification]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      ADMITTED_SHA: ${{ needs.v223-control-admission.outputs.candidate_sha }}
      CERTIFIED_SHA: ${{ needs.full-windows-certification.outputs.certified_sha }}
      CLOUDSCRIBE_V223_MASTER_PACKAGE: ${{ inputs.master_package_path }}
    steps:
      - name: Require exact admitted and certified identity
        shell: pwsh
        run: |
          if ($env:ADMITTED_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Admitted SHA is invalid.' }
          if ($env:CERTIFIED_SHA -ne $env:ADMITTED_SHA) { throw 'Promotion readiness requires the exact admitted SHA to be the exact certified SHA.' }
      - name: Checkout certified SHA only
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.full-windows-certification.outputs.certified_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify certified repository object integrity
        shell: pwsh
        run: |
          ./tools/Test-Stage4V223RepositoryIntegrity.ps1 -ExpectedCandidateSha $env:CERTIFIED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Certified candidate repository integrity failed before promotion readiness.' }
      - name: Re-preflight promotion runner and authenticated package
        shell: pwsh
        run: |
          ./tools/Test-Stage4V223RunnerPreflight.ps1 -MasterPackagePath $env:CLOUDSCRIBE_V223_MASTER_PACKAGE -ExpectedCandidateSha $env:CERTIFIED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Promotion readiness runner/package preflight failed.' }
      - name: Re-admit promotion certification environment
        shell: pwsh
        run: |
          ./scripts/Test-Stage4V223CertificationEnvironment.ps1 -ExpectedCandidateSha $env:CERTIFIED_SHA -MasterPackagePath $env:CLOUDSCRIBE_V223_MASTER_PACKAGE
          if ($LASTEXITCODE -ne 0) { throw 'Promotion readiness certification environment gate failed.' }
      - name: Re-admit unchanged v2.23 controls before promotion handoff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CERTIFIED_SHA) { throw 'Promotion readiness is not checking the certified SHA.' }
          ./tools/Test-V223ControlAdmission.ps1 -MasterPackagePath $env:CLOUDSCRIBE_V223_MASTER_PACKAGE
          if ($LASTEXITCODE -ne 0) { throw 'v2.23 controls no longer admit the certified candidate.' }
          if (@(git status --porcelain=v1).Count -ne 0) { throw 'Promotion readiness changed or introduced candidate files.' }
          if ((git rev-parse HEAD).Trim() -ne $env:CERTIFIED_SHA) { throw 'Candidate SHA changed during promotion readiness.' }
      - name: Final repository integrity recheck before promotion handoff
        shell: pwsh
        run: |
          ./tools/Test-Stage4V223RepositoryIntegrity.ps1 -ExpectedCandidateSha $env:CERTIFIED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Repository integrity failed at final no-change promotion handoff.' }
