name: CloudScribe Stage 4 v2.23 Manifest Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudscribe-stage4-v223-manifest-sync
  cancel-in-progress: false

jobs:
  refresh-manifest-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative Stage 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage4-v223-reconciliation
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh manifest only when deterministic renderer differs
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          [[ "${before}" =~ ^[0-9a-f]{40}$ ]]
          python -B tools/update_sha256_manifest.py
          changed="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -z "${changed}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${changed}" != " M SHA256SUMS.txt" ]; then
            echo "Refusing unexpected source mutation while refreshing SHA256SUMS.txt:" >&2
            printf '%s\n' "${changed}" >&2
            exit 1
          fi
          python -B tools/update_sha256_manifest.py --check
          git diff --exit-code -- . ':!SHA256SUMS.txt'
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Commit exact deterministic manifest refresh
        if: steps.refresh.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- SHA256SUMS.txt
          test "$(git diff --cached --name-only)" = "SHA256SUMS.txt"
          git commit -m "chore(stage4): refresh frozen source SHA-256 manifest"
          git push origin HEAD:refs/heads/agent/stage4-v223-reconciliation
