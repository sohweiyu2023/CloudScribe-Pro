name: CloudScribe 0.3.48 Stage 2 Windows Certification

on:
  push:
    branches:
      - cloudscribe-0.3.48-stage2-certification
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-stage2:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Reconstruct exact repaired source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadRoot = '.cloudscribe-ci/payload'
          $partNames = @(
            '000.bin','001.bin','002.bin','003.bin','004.bin','005.bin','006.bin',
            '007a.bin','007b.bin','008.bin','009.bin','010a.bin','010b.bin','011a.bin','011b.bin'
          )
          $archive = Join-Path $env:RUNNER_TEMP 'CloudScribe-0.3.48-native-ci-min.tar.xz'
          $stream = [IO.File]::Open($archive,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try {
            foreach ($name in $partNames) {
              $path = Join-Path $payloadRoot $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing carrier part: $name" }
              $bytes = [IO.File]::ReadAllBytes($path)
              $stream.Write($bytes,0,$bytes.Length)
            }
          } finally { $stream.Dispose() }
          $info = Get-Item $archive
          if ($info.Length -ne 95596) { throw "Carrier length mismatch: $($info.Length)" }
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '1649cdfaa71f10ce4803fd468285295bf597cb805bf594dd542c386fa04fcd3b') { throw "Carrier SHA-256 mismatch: $sha" }
          $root = Join-Path $env:RUNNER_TEMP 'cloudscribe-0.3.48-src'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          & tar.exe -xJf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $root 'CloudScribe.sln'))) { throw 'CloudScribe.sln missing after source extraction.' }
          "CS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Exact source carrier verified: $sha ($($info.Length) bytes)"

      - name: Reconstruct hash-bound architecture fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = '.cloudscribe-ci/fixtures'
          $fixtureNames = @('000.bin','001.bin','002.bin')
          $archive = Join-Path $env:RUNNER_TEMP 'architecture-fixtures.tar.xz'
          $stream = [IO.File]::Open($archive,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try {
            foreach ($name in $fixtureNames) {
              $path = Join-Path $fixtureRoot $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing fixture part: $name" }
              $bytes = [IO.File]::ReadAllBytes($path)
              $stream.Write($bytes,0,$bytes.Length)
            }
          } finally { $stream.Dispose() }
          $info = Get-Item $archive
          if ($info.Length -ne 8812) { throw "Fixture carrier length mismatch: $($info.Length)" }
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'a866788937570bd4be228c76035b170aec47d929712e96d7a08b9152239a6d11') { throw "Fixture carrier SHA-256 mismatch: $sha" }
          & tar.exe -xJf $archive -C $env:CS_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Fixture extraction failed: $LASTEXITCODE" }
          $expected = @{
            'scripts/verify-stage2.sh' = 'b57f01ec004db6850ee0170d0410b0515089da58645b2643153cec1f8eedd28c'
            'scripts/verify-stage2.ps1' = '6c33fc799e1d26882ebc8398f0e89fc84c3787d8fa6f7acff7f24d320149e23a'
            'scripts/capture-stage2-linux.sh' = 'c9b1018a799b460d1ba004fd45b792febdade90eda88f71d7e2255adf37f689f'
            'scripts/invoke-nuget-audit-scan.sh' = '573264ce2f752cd59834ddd68dc51b0fe87411cb643e84a0bb225876286b2de5'
          }
          foreach ($relative in $expected.Keys) {
            $path = Join-Path $env:CS_ROOT $relative
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$relative]) { throw "Fixture hash mismatch for ${relative}: $actual" }
          }
          Write-Host "Exact architecture fixture carrier verified: $sha ($($info.Length) bytes)"

      - name: Overlay hash-bound candidate hotfixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hotfixRoot = '.cloudscribe-ci/hotfix'
          $hotfixNames = @(
            '000.bin','001.bin',
            '002s_00.bin','002s_01.bin','002s_02.bin','002s_03.bin','002s_04.bin','002s_05.bin','002s_06.bin'
          )
          $archive = Join-Path $env:RUNNER_TEMP 'candidate-hotfixes.tar.xz'
          $stream = [IO.File]::Open($archive,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try {
            foreach ($name in $hotfixNames) {
              $path = Join-Path $hotfixRoot $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing hotfix part: $name" }
              $bytes = [IO.File]::ReadAllBytes($path)
              $stream.Write($bytes,0,$bytes.Length)
            }
          } finally { $stream.Dispose() }
          $info = Get-Item $archive
          if ($info.Length -ne 11364) { throw "Hotfix carrier length mismatch: $($info.Length)" }
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '7d64e649b9f3f2d8480d3f093da8eebc3caf01a89e92e4a4b006891c4e43e6aa') { throw "Hotfix carrier SHA-256 mismatch: $sha" }
          & tar.exe -xJf $archive -C $env:CS_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Hotfix extraction failed: $LASTEXITCODE" }
          $expected = @{
            'scripts/invoke-nuget-audit-scan.ps1' = '3c70d5c1cb30c5c8f805353c81cc1a6aed2fc365da9a9d52092cf14e339f0be3'
            'tests/CloudScribe.Architecture.Tests/AdaptiveShellTests.cs' = 'ccf6b1d09e0c7a0cc232d5f2d19fc2a742006a13cc91727bdba00eacf30c81a3'
            'tests/CloudScribe.Infrastructure.Tests/StartupAndDiagnosticsResilienceTests.cs' = 'd0d6a3d8e2a88aa09ecb1fb6a00943d71a6b4c92d0d36e37e94c0b5e83edb764'
          }
          foreach ($relative in $expected.Keys) {
            $path = Join-Path $env:CS_ROOT $relative
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$relative]) { throw "Candidate hotfix hash mismatch for ${relative}: $actual" }
          }
          Write-Host "Exact candidate hotfix carrier verified: $sha ($($info.Length) bytes)"

      - name: Finalize exact 0.3.48 repair state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)

          $wrapperPath = Join-Path $env:CS_ROOT 'scripts/invoke-nuget-audit-scan.ps1'
          $wrapperHotfix = '3c70d5c1cb30c5c8f805353c81cc1a6aed2fc365da9a9d52092cf14e339f0be3'
          $wrapperFinal = 'de5981b2ef579c6b85261cd5ef8543cf937b79243688804777987c2274e41841'
          $wrapperHash = (Get-FileHash -LiteralPath $wrapperPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wrapperHash -eq $wrapperHotfix) {
            $text = [IO.File]::ReadAllText($wrapperPath).Replace("`r`n","`n").Replace("`r","`n")
            $anchor = '}' + "`n" + '$projectPath = $projectItem.FullName'
            $replacement = '}' + "`n" + 'if ($null -eq $cursor) {' + "`n" + '    throw "Audit target must resolve beneath the CloudScribe repository: $Project"' + "`n" + '}' + "`n" + '$projectPath = $projectItem.FullName'
            if (-not $text.Contains($anchor)) { throw 'Windows audit finalization anchor was not found.' }
            $text = $text.Replace($anchor,$replacement)
            [IO.File]::WriteAllText($wrapperPath,$text,$utf8NoBom)
          }
          elseif ($wrapperHash -ne $wrapperFinal) { throw "Unexpected Windows audit wrapper preimage: $wrapperHash" }
          $wrapperHash = (Get-FileHash -LiteralPath $wrapperPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wrapperHash -ne $wrapperFinal) { throw "Final Windows audit wrapper hash mismatch: $wrapperHash" }

          $architecturePath = Join-Path $env:CS_ROOT 'tests/CloudScribe.Architecture.Tests/AdaptiveShellTests.cs'
          $architectureHotfix = 'ccf6b1d09e0c7a0cc232d5f2d19fc2a742006a13cc91727bdba00eacf30c81a3'
          $architectureFinal = 'f92c0f76d5e278efe91e071056bb853117100a6b0702463d4fbd35ca18fe1819'
          $architectureHash = (Get-FileHash -LiteralPath $architecturePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($architectureHash -eq $architectureHotfix) {
            $text = [IO.File]::ReadAllText($architecturePath).Replace("`r`n","`n").Replace("`r","`n")
            $old = '        Assert.Contains("$projectItem.Directory", windowsAudit, StringComparison.Ordinal);' + "`n" + '        Assert.Contains("projectItem.Attributes", windowsAudit, StringComparison.Ordinal);'
            $new = '        Assert.Contains("$cursor = $projectItem.Directory", windowsAudit, StringComparison.Ordinal);' + "`n" + '        Assert.DoesNotContain("$cursor = $projectItem\n", windowsAudit, StringComparison.Ordinal);'
            if (-not $text.Contains($old)) { throw 'Architecture regression finalization block was not found.' }
            $text = $text.Replace($old,$new)
            [IO.File]::WriteAllText($architecturePath,$text,$utf8NoBom)
          }
          elseif ($architectureHash -ne $architectureFinal) { throw "Unexpected architecture test preimage: $architectureHash" }
          $architectureHash = (Get-FileHash -LiteralPath $architecturePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($architectureHash -ne $architectureFinal) { throw "Final architecture test hash mismatch: $architectureHash" }

          $smokeOverlay = Join-Path $env:GITHUB_WORKSPACE '.cloudscribe-ci/final-overlay/smoke-stage1-windows.ps1'
          $smokePath = Join-Path $env:CS_ROOT 'scripts/smoke-stage1-windows.ps1'
          $smokeFinal = '7b1a564dde8677bf20809c5a582a7491caa76c00efc8e80088fcad6f34e892df'
          $smokeText = [IO.File]::ReadAllText($smokeOverlay).Replace("`r`n","`n").Replace("`r","`n")
          [IO.File]::WriteAllText($smokePath,$smokeText,$utf8NoBom)
          $smokeHash = (Get-FileHash -LiteralPath $smokePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($smokeHash -ne $smokeFinal) { throw "Final Windows smoke hash mismatch: $smokeHash" }

          Write-Host "Exact final repair state verified: wrapper=$wrapperHash architecture=$architectureHash smoke=$smokeHash"

      - name: Run full native Windows certification
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .cloudscribe-ci/invoke-cloudscribe-048-certification.ps1 -SourceRoot $env:CS_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Native certification failed: $LASTEXITCODE" }

      - name: Freeze exact repaired source ZIP and verify extracted bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Set-Location -LiteralPath $env:CS_ROOT

          python tools/update_sha256_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Final source manifest is not clean before archive freeze.' }

          $releaseName = 'CloudScribe_Pro_Source_0.3.48-stage2-repair-in-progress'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'final-source-release'
          $archivePath = Join-Path $releaseRoot ($releaseName + '.zip')
          $shaPath = $archivePath + '.sha256'
          $extractParent = Join-Path $env:RUNNER_TEMP 'final-source-fresh-extract'
          Remove-Item -LiteralPath $releaseRoot,$extractParent -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $releaseRoot,$extractParent -Force | Out-Null

          $excludedSegments = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($segment in @('bin','obj','TestResults','__pycache__','.vs','.git')) { [void]$excludedSegments.Add($segment) }

          function Get-ReleasableFiles([string]$Root) {
            Get-ChildItem -LiteralPath $Root -Recurse -File -Force | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($Root,$_.FullName).Replace('\','/')
              $segments = $relative.Split('/',[StringSplitOptions]::RemoveEmptyEntries)
              if (-not ($segments | Where-Object { $excludedSegments.Contains($_) })) {
                [pscustomobject]@{ FullName = $_.FullName; Relative = $relative }
              }
            } | Sort-Object Relative
          }

          $sourceFiles = @(Get-ReleasableFiles $env:CS_ROOT)
          if ($sourceFiles.Count -lt 100) { throw "Refusing to archive unexpectedly small source tree: $($sourceFiles.Count) files." }
          if ($sourceFiles.Relative -notcontains 'CloudScribe.sln' -or $sourceFiles.Relative -notcontains 'SHA256SUMS.txt') {
            throw 'Release file inventory is missing CloudScribe.sln or SHA256SUMS.txt.'
          }

          Add-Type -AssemblyName System.IO.Compression
          $fileStream = [IO.File]::Open($archivePath,[IO.FileMode]::CreateNew,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
          try {
            $zip = [IO.Compression.ZipArchive]::new($fileStream,[IO.Compression.ZipArchiveMode]::Create,$true)
            try {
              $fixedTime = [DateTimeOffset]::new(2026,8,10,0,0,0,[TimeSpan]::Zero)
              foreach ($file in $sourceFiles) {
                $entry = $zip.CreateEntry(($releaseName + '/' + $file.Relative),[IO.Compression.CompressionLevel]::Optimal)
                $entry.LastWriteTime = $fixedTime
                $input = [IO.File]::OpenRead($file.FullName)
                try {
                  $output = $entry.Open()
                  try { $input.CopyTo($output) } finally { $output.Dispose() }
                } finally { $input.Dispose() }
              }
            } finally { $zip.Dispose() }
          } finally { $fileStream.Dispose() }

          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) { throw 'Final source ZIP was not created.' }
          $archiveInfo = Get-Item -LiteralPath $archivePath
          if ($archiveInfo.Length -le 0) { throw 'Final source ZIP is empty.' }
          $archiveSha = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($shaPath,"$archiveSha *$($archiveInfo.Name)`n",[Text.UTF8Encoding]::new($false))

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractParent
          $freshRoot = Join-Path $extractParent $releaseName
          if (-not (Test-Path -LiteralPath (Join-Path $freshRoot 'CloudScribe.sln') -PathType Leaf)) {
            throw 'Fresh extraction is missing CloudScribe.sln.'
          }

          $freshFiles = @(Get-ReleasableFiles $freshRoot)
          if ($freshFiles.Count -ne $sourceFiles.Count) {
            throw "Fresh extraction file-count mismatch: source=$($sourceFiles.Count) extracted=$($freshFiles.Count)."
          }
          for ($i = 0; $i -lt $sourceFiles.Count; $i++) {
            if ($sourceFiles[$i].Relative -ne $freshFiles[$i].Relative) {
              throw "Fresh extraction path mismatch at index ${i}: source=$($sourceFiles[$i].Relative) extracted=$($freshFiles[$i].Relative)."
            }
            $sourceSha = (Get-FileHash -LiteralPath $sourceFiles[$i].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $freshSha = (Get-FileHash -LiteralPath $freshFiles[$i].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sourceSha -ne $freshSha) { throw "Fresh extraction byte mismatch: $($sourceFiles[$i].Relative)" }
          }

          Push-Location -LiteralPath $freshRoot
          try {
            python tools/update_sha256_manifest.py --check
            if ($LASTEXITCODE -ne 0) { throw 'Fresh-extracted source manifest verification failed.' }
          } finally { Pop-Location }

          "FINAL_SOURCE_RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINAL_SOURCE_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINAL_SOURCE_SHA256=$archiveSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINAL_SOURCE_FRESH_ROOT=$freshRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Frozen exact repaired source ZIP: $archivePath"
          Write-Host "Final source ZIP SHA-256: $archiveSha"
          Write-Host "Fresh-extracted byte parity PASS: $($sourceFiles.Count) files"

      - name: Run complete Stage 2 material gate on fresh-extracted final ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $freshRoot = $env:FINAL_SOURCE_FRESH_ROOT
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'fresh-extracted-stage2-material-evidence'
          Remove-Item -LiteralPath $evidenceRoot -Recurse -Force -ErrorAction SilentlyContinue
          $env:CLOUDSCRIBE_STAGE2_EVIDENCE_DIR = $evidenceRoot

          & pwsh -NoProfile -File (Join-Path $freshRoot 'scripts/verify-stage2.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Fresh-extracted complete Stage 2 material gate failed: $LASTEXITCODE" }

          $summaryPath = Join-Path $evidenceRoot 'verification-summary.json'
          if (-not (Test-Path -LiteralPath $summaryPath -PathType Leaf)) { throw 'Fresh material gate did not produce verification-summary.json.' }
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          if ($summary.status -ne 'passed') { throw "Fresh material gate summary status is not passed: $($summary.status)" }
          if ([int]$summary.package_scan_files -ne 18) { throw "Expected 18 package scan files in material summary, got $($summary.package_scan_files)." }
          if ([int]$summary.screenshot_files -ne 17) { throw "Expected 17 screenshots in material summary, got $($summary.screenshot_files)." }
          if ([int]$summary.test_result_files -ne 4) { throw "Expected 4 test result files in material summary, got $($summary.test_result_files)." }

          $scanCount = @(Get-ChildItem -LiteralPath (Join-Path $evidenceRoot 'package-scans') -Filter '*.json' -File).Count
          $pngCount = @(Get-ChildItem -LiteralPath (Join-Path $evidenceRoot 'visual') -Filter '*.png' -File).Count
          $trxCount = @(Get-ChildItem -LiteralPath (Join-Path $evidenceRoot 'test-results') -Filter '*.trx' -File -Recurse).Count
          if ($scanCount -ne 18 -or $pngCount -ne 17 -or $trxCount -ne 4) {
            throw "Fresh material evidence inventory mismatch: scans=$scanCount png=$pngCount trx=$trxCount; expected 18/17/4."
          }

          $ledgerPath = Join-Path $evidenceRoot 'logs/command-ledger.jsonl'
          if (-not (Test-Path -LiteralPath $ledgerPath -PathType Leaf)) { throw 'Fresh material gate command ledger is missing.' }
          $ledger = @(Get-Content -LiteralPath $ledgerPath | ForEach-Object { $_ | ConvertFrom-Json })
          if ($ledger.Count -ne 87) { throw "Expected STEP 01-87 command ledger, found $($ledger.Count) records." }
          if (@($ledger | Where-Object { $_.status -ne 'passed' }).Count -ne 0) { throw 'Fresh material gate command ledger contains a non-passing STEP.' }
          $sequences = @($ledger | ForEach-Object { [int]$_.sequence })
          if (($sequences | Measure-Object -Minimum).Minimum -ne 1 -or ($sequences | Measure-Object -Maximum).Maximum -ne 87) {
            throw 'Fresh material gate command ledger does not span STEP 01 through STEP 87.'
          }

          Push-Location -LiteralPath $freshRoot
          try {
            python tools/update_sha256_manifest.py --check
            if ($LASTEXITCODE -ne 0) { throw 'Fresh source manifest changed during complete Stage 2 material gate.' }
          } finally { Pop-Location }

          $archiveShaAfter = (Get-FileHash -LiteralPath $env:FINAL_SOURCE_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveShaAfter -ne $env:FINAL_SOURCE_SHA256) { throw 'Frozen final source ZIP changed during fresh material verification.' }
          "FINAL_MATERIAL_EVIDENCE=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'FRESH_EXTRACTED_STAGE2_MATERIAL_GATE=PASS'
          Write-Host "Verified STEP 01-87; 18 package scans; 17 source-bound captures; 4 TRX files; archive SHA-256 $archiveShaAfter"

      - name: Upload final source ZIP and fresh material evidence
        uses: actions/upload-artifact@v7
        with:
          name: cloudscribe-0.3.48-final-source-and-material-evidence
          path: |
            ${{ runner.temp }}/final-source-release
            ${{ runner.temp }}/fresh-extracted-stage2-material-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudscribe-0.3.48-windows-certification-evidence
          path: |
            ${{ runner.temp }}/test-results
            ${{ runner.temp }}/package-scans
            ${{ runner.temp }}/stage2-screenshots
            ${{ runner.temp }}/CloudScribe-publish
            ${{ runner.temp }}/cloudscribe-stage1-smoke-*
          if-no-files-found: warn
          retention-days: 7
