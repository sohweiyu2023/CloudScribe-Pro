name: CloudScribe Stage 4 foundation batch 11 admission v2
# registration trigger v2

on:
  workflow_dispatch:
  push:
    branches: [cloudscribe-stage4-batch11-v2-dev]
    paths: [.github/workflows/cloudscribe-stage4-batch11-admission-v2.yml]

concurrency:
  group: cloudscribe-stage4-batch11-admission-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  admit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-stage4-batch11-v2-dev
          path: carrier
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: cloudscribe-0.5.0-stage4
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: source/**/packages.lock.json
      - name: Run exact Batch 11 v2 admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = 'carrier/.cloudscribe-ci/stage4-batch11-v2/admit_batch11_v2.ps1'
          $expectedRunnerBlob = '36c828cb728535c2b1b301362eef0aea68658faa'
          if (-not (Test-Path $runner -PathType Leaf)) { throw 'Batch 11 v2 admission runner is missing.' }
          $actualRunnerBlob = (git -C carrier hash-object .cloudscribe-ci/stage4-batch11-v2/admit_batch11_v2.ps1).Trim()
          if ($actualRunnerBlob -ne $expectedRunnerBlob) { throw "Batch 11 v2 admission runner blob mismatch: $actualRunnerBlob" }
          & $runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Batch 11 v2 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudscribe-stage4-foundation-batch11-admission-v2
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage4-batch11-v2-tests/**
            ${{ runner.temp }}/stage4-batch11-v2-package/**
            ${{ runner.temp }}/stage4-batch11-v2-evidence/**
